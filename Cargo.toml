[workspace]
members = ["shared", "sim", "solo", "server", "clients/tui"]
resolver = "2"

# The determinism tests run tens of thousands of ticks; unoptimised they take minutes.
[profile.dev.package.iac-sim]
opt-level = 2

[profile.dev.package.iac-shared]
opt-level = 2

# The restart test writes thousands of ticks through SQLite.
[profile.dev.package.libsqlite3-sys]
opt-level = 2

[profile.dev.package.rusqlite]
opt-level = 2

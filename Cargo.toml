[workspace]
members = ["shared", "sim", "solo", "server", "clients/tui"]
resolver = "2"

# The determinism tests run tens of thousands of ticks; unoptimised they take minutes.
[profile.dev.package.iac-sim]
opt-level = 2

[profile.dev.package.iac-shared]
opt-level = 2

[profile.dev.package.libm]
opt-level = 2

# The interpreter that runs iac_solo.wasm beside the native engine
# (solo/tests/both_targets.rs). Its loop is a chain of tail calls, which the
# compiler makes only when optimising and with these two checks off;
# without them the interpreter overflows its stack.
[profile.dev.package.wasmi]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmi_core]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmi_ir]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmi_collections]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmparser]
opt-level = 3

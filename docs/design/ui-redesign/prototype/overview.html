<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IAC Overview (prototype)</title><link rel="stylesheet" href="iac.css">
<style>
.scroll{position:absolute;inset:0;overflow:auto;padding:16px 18px 40px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;max-width:1500px;margin:0 auto}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c4{grid-column:span 4}.c3{grid-column:span 3}.c5{grid-column:span 5}.c7{grid-column:span 7}
.hero{position:relative;height:236px;overflow:hidden;padding:0}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .tx{position:absolute;left:24px;top:18px;right:40%;z-index:2}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:40px;letter-spacing:.08em;color:var(--a100);text-shadow:0 0 30px rgba(255,176,0,.5);line-height:1}
.hero .sup{font-family:var(--f-display);letter-spacing:.32em;font-size:10px;color:var(--text-3);margin-bottom:6px}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.hero .voice{max-width:420px;font-size:14px}
.hero .stat{position:absolute;left:24px;bottom:14px;z-index:2;display:flex;gap:26px}
.hero .stat div b{display:block;font-family:var(--f-display);font-size:22px;color:var(--a200);font-weight:600}
.hero .stat span{font-size:9.5px;letter-spacing:.16em;color:var(--text-3);font-family:var(--f-display);text-transform:uppercase}
.next{padding:0;overflow:hidden;display:flex;flex-direction:column}
.next .bd{padding:2px 16px 16px}
.next h3{font-family:var(--f-display);font-weight:600;font-size:19px;color:var(--a100);letter-spacing:.03em;line-height:1.2;margin:2px 0 6px}
.next .why{color:var(--text-2);font-size:12px;line-height:1.5;margin-bottom:12px}
.kv2{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-bottom:4px}.cost{display:inline-flex;gap:10px;font-size:11.5px;margin-right:8px}
.rt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.rtile{padding:14px 16px 14px;position:relative;overflow:hidden}
.rtile .top{display:flex;align-items:center;gap:10px}
.rtile .gem{width:14px;height:14px;transform:rotate(45deg);background:var(--c);box-shadow:0 0 14px var(--c)}
.rtile .nm{font-family:var(--f-display);letter-spacing:.2em;font-size:11px;color:var(--text-2);text-transform:uppercase}
.rtile .big{font-family:var(--f-display);font-weight:600;font-size:38px;color:var(--a100);margin:6px 0 2px;letter-spacing:.01em;font-variant-numeric:tabular-nums;line-height:1}
.rtile .big small{font-size:14px;color:var(--text-3);margin-left:6px;font-weight:400}
.rtile .rate{font-size:11.5px;color:var(--c)}
.rtile .rate span{color:var(--text-3)}
.rtile .full{margin-top:10px;font-size:10.5px;display:flex;justify-content:space-between;color:var(--text-3)}
.rtile canvas{position:absolute;right:12px;top:14px;width:120px;height:44px;opacity:.9}
.rtile .bar>i{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,#000),var(--c));box-shadow:0 0 10px var(--c)}
.rtile.warn{border-color:var(--ember);animation:pulse-b 1.4s infinite}
.q4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.qc{padding:0;display:flex;flex-direction:column;min-height:206px}
.qc .bd{padding:2px 14px 14px;flex:1;display:flex;flex-direction:column}
.qc .t{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--a100)}
.qc .s{font-size:11px;color:var(--text-3);margin:2px 0 10px}
.ringw{display:flex;gap:14px;align-items:center}
.ring{width:74px;height:74px;position:relative;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:5}.ring .b{stroke:rgba(255,176,0,.1)}.ring .f{stroke:var(--a400);stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(255,176,0,.6));transition:stroke-dashoffset .9s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:13px;color:var(--a100);font-weight:600}
.cd{font-family:var(--f-display);font-weight:600;font-size:26px;color:var(--a100);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.qc.idle{border-color:var(--a500);animation:pulse-a 1.6s infinite}
@keyframes pulse-a{50%{box-shadow:0 0 22px rgba(255,176,0,.35)}}
.qc.idle .badge{color:#2a1900;background:var(--a400);font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:9.5px;padding:2px 7px;border-radius:3px;animation:blink 1.2s infinite}
.qc.lock{opacity:.78}.qc.lock .bd{align-items:center;justify-content:center;text-align:center;color:var(--text-3)}
.sug{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sug button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:6px 9px;border:1px solid var(--line);border-radius:4px;background:rgba(0,0,0,.25);font-size:11px;text-align:left;transition:.14s}
.sug button:hover{border-color:var(--a500);background:rgba(255,176,0,.1)}
.sug button small{color:var(--text-3);font-size:9.5px;display:block}
.fl3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:2px 14px 14px}
.flc{border:1px solid var(--line);border-radius:5px;padding:11px;background:rgba(0,0,0,.2);transition:.15s}.flc:hover{border-color:var(--line-hi)}
.flc .n{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;color:var(--a200);font-size:14px}
.flc .ships{display:flex;gap:3px;margin:8px 0;align-items:center}
.flc .ships svg{width:16px;height:16px;fill:rgba(94,224,207,.18);stroke:var(--own);stroke-width:1.4}
.flc .kv{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-3);margin:6px 0 3px}.flc .kv b{color:var(--text);font-weight:500}
.flc .act{display:flex;gap:6px;margin-top:10px}
.al{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line-lo);align-items:flex-start;animation:rise .4s var(--ease)}
.al .dotc{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:none;background:var(--c);box-shadow:0 0 8px var(--c)}
.al.crit{background:linear-gradient(90deg,rgba(255,90,60,.12),transparent)}
.al b{font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.04em;color:var(--text)}.al p{font-size:11px;color:var(--text-2);margin-top:2px;line-height:1.4}
.al .tm{margin-left:auto;font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--c);white-space:nowrap}
.ev{max-height:300px;overflow:auto;padding:0 6px 8px}
.ev div{display:flex;gap:8px;padding:5px 8px;font-size:11.5px;border-left:2px solid var(--c,var(--a700));margin:3px 0;background:linear-gradient(90deg,rgba(255,255,255,.025),transparent);animation:rise .3s var(--ease)}
.ev div i{font-style:normal;color:var(--text-4);min-width:38px}
.filters{display:flex;gap:5px;padding:0 12px 6px}
#lb>div{display:flex;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid var(--line-lo);font-size:12px}
#lb>div.me{background:rgba(94,224,207,.1);color:var(--own)}
.lb .rk{width:22px;color:var(--text-3);font-family:var(--f-display);font-weight:600}.lb .sc{margin-left:auto;color:var(--a300)}
.tag{font-size:8.5px;letter-spacing:.14em;padding:1px 5px;border-radius:3px;border:1px solid var(--line);color:var(--text-3);font-family:var(--f-display)}.tag.ai{color:var(--rare);border-color:#5c4690}
#chat>div{padding:4px 14px;font-size:11.5px;line-height:1.4;color:var(--text-2)}.chat b{color:var(--a300);font-weight:500}.chat .trade{margin:4px 14px;padding:7px 10px;border:1px dashed var(--a600);border-radius:4px;color:var(--a200)}
.radar{position:relative;height:250px;padding:0}.radar canvas{width:100%;height:100%;display:block;cursor:pointer}
.hdr-note{font-size:10px;color:var(--text-4);letter-spacing:.1em;text-transform:uppercase;margin:0 0 -6px 2px}
@media (max-width:1100px){.c8,.c4,.c3,.c5,.c7{grid-column:span 12}.q4{grid-template-columns:repeat(2,minmax(0,1fr))}.fl3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.scroll{padding:10px 10px 30px}.rt{grid-template-columns:minmax(0,1fr)}.q4{grid-template-columns:minmax(0,1fr)}.hero .chips .chip:nth-child(n+3){display:none}.hero{height:200px}.hero .tx{right:12px}.hero h1{font-size:28px}.hero .stat{display:none}.rtile .big{font-size:30px}.rtile canvas{display:none}}
</style></head><body>
<script src="iac.js"></script>
<script>
const I=IAC; I.start();
const main=I.mount('overview',{badges:{overview:2}});
const t0=I.tick;
const Q={a:{name:'Crystal Mine',to:8,s:t0-420,e:t0+260},res:null,yard:{cls:'Corvette',n:3,done:1,s:t0-200,e:t0+170,per:120},b:null};
const SUG=[{n:'Navigation',to:2,cost:{m:600,c:800,d:0},t:760,why:'+1 scan range'},{n:'Harvesting Efficiency',to:3,cost:{m:900,c:500,d:120},t:1100,why:'+8% ore per trip'},{n:'Logistics',to:1,cost:{m:1200,c:1500,d:200},t:2400,why:'Unlocks building slot B'}];
const raidAt=t0+252;
main.innerHTML=`<div class="scroll"><div class="grid">
<div class="c8 panel hero" id="hero"><canvas id="pl"></canvas><div class="tx"><div class="sup">HOMEWORLD &middot; SECTOR 4, -2</div><h1>Ember Landing</h1>
 <div class="chips"><span class="chip on">Inner Ring</span><span class="chip">Sensor L3</span><span class="chip teal">Defence Grid L2</span><span class="chip">Fuel Depot L2</span></div>
 <div class="voice">All quiet on the surface. Two fleets out, one at the dock. The ore does not mine itself.</div></div>
 <div class="stat"><div><b id="st-b">48</b><span>Building levels</span></div><div><b id="st-r">9</b><span>Research</span></div><div><b id="st-s">14</b><span>Ships</span></div></div></div>
<div class="c4 panel next" id="next"></div>
<div class="c12 rt" id="rt"></div>
<div class="c12 q4" id="qs"></div>
<div class="c8 panel" style="padding:0"><div class="ph">Fleets <span class="sub">3 / 3 slots</span></div><div class="fl3" id="fleets"></div></div>
<div class="c4 panel radar" id="radarw"><div class="ph" style="position:absolute;z-index:2">Nearby space <span class="sub" style="margin-left:12px">click to open map</span></div><canvas id="radar"></canvas></div>
<div class="c5 panel" style="padding:0"><div class="ph">Alerts <span class="sub" id="alc"></span></div><div id="alerts"></div></div>
<div class="c7 panel" style="padding:0"><div class="ph">Event feed</div><div class="filters" id="filters"></div><div class="ev" id="ev"></div></div>
<div class="c4 panel lb" style="padding:0 0 6px"><div class="ph">Leaderboard <span class="sub">humans + agents, one ranking</span></div><div id="lb"></div></div>
<div class="c4 panel chat" style="padding:0 0 10px"><div class="ph">Comms <span class="sub">Global &middot; 2 trade offers</span></div><div id="chat"></div></div>
<div class="c4 panel" style="padding:0 0 10px"><div class="ph">Team-ups <span class="sub">PvE, open</span></div><div class="pb" style="font-size:11.5px;color:var(--text-2);line-height:1.5"><div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-lo)"><span><b style="color:var(--a200)">Clear 9,-7</b> &middot; Lethal swarm<br><span style="color:var(--text-3)">needs 440 power, has 310 pledged</span></span><button class="btn sm">Join</button></div><div style="display:flex;justify-content:space-between;padding:6px 0"><span><b style="color:var(--a200)">Escort haulers to 12,-9</b><br><span style="color:var(--text-3)">Sparrow (AI) &middot; 2 slots open</span></span><button class="btn sm">Join</button></div></div></div>
</div></div>`;
/* ---------- planet hero ---------- */
const pc=document.getElementById('pl'),px=pc.getContext('2d');let PW,PH;
function sizeP(){const r=pc.getBoundingClientRect();PW=r.width;PH=r.height;pc.width=PW*2;pc.height=PH*2}
const pst=[...Array(160)].map(()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.3+.3,t:Math.random()*6}));
function drawPlanet(now){const t=now/1000;px.setTransform(2,0,0,2,0,0);px.clearRect(0,0,PW,PH);
  const bg=px.createLinearGradient(0,0,PW,0);bg.addColorStop(0,'rgba(8,6,10,.95)');bg.addColorStop(.55,'rgba(14,9,6,.55)');bg.addColorStop(1,'rgba(40,22,6,.5)');px.fillStyle=bg;px.fillRect(0,0,PW,PH);
  pst.forEach(s=>{px.fillStyle=`rgba(255,226,170,${.25+.4*Math.sin(t+s.t)**2})`;px.fillRect(s.x*PW,s.y*PH,s.s,s.s)});
  const r=Math.min(PH*.42,PW*.16),x=PW*.78,y=PH*.5;
  const halo=px.createRadialGradient(x,y,r*.9,x,y,r*2.1);halo.addColorStop(0,'rgba(255,150,30,.35)');halo.addColorStop(1,'transparent');px.fillStyle=halo;px.fillRect(0,0,PW,PH);
  const g=px.createRadialGradient(x-r*.45,y-r*.45,r*.1,x,y,r);g.addColorStop(0,'#ffd88a');g.addColorStop(.3,'#c98424');g.addColorStop(.7,'#5a3208');g.addColorStop(1,'#140b03');px.fillStyle=g;px.beginPath();px.arc(x,y,r,0,6.2832);px.fill();
  px.save();px.beginPath();px.arc(x,y,r,0,6.2832);px.clip();for(let i=0;i<14;i++){const yy=y-r+i*r*.15+Math.sin(t*.3+i)*2;px.fillStyle=i%2?'rgba(255,214,130,.10)':'rgba(90,40,6,.18)';px.fillRect(x-r,yy,r*2,r*.09);}
  // city lights on night side
  for(let i=0;i<40;i++){const a=i*2.4+t*.02,rr=Math.sqrt((i*37%100)/100)*r*.95;const lx=x+Math.cos(a)*rr*.9+r*.25,ly=y+Math.sin(a*1.3)*rr*.8;px.fillStyle=`rgba(255,235,170,${.2+.5*Math.sin(t*2+i)**2})`;px.fillRect(lx,ly,1.5,1.5)}
  const sh=px.createLinearGradient(x-r*1.1,y,x+r*1.1,y);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(.45,'rgba(0,0,0,.15)');sh.addColorStop(1,'rgba(0,0,0,.9)');px.fillStyle=sh;px.fillRect(x-r,y-r,r*2,r*2);px.restore();
  // orbit rings + platforms
  [[1.55,.32,-.3,'rgba(255,200,100,.35)',3],[2.0,.45,-.3,'rgba(94,224,207,.25)',2]].forEach(([k,e,rot,c,n],ri)=>{px.strokeStyle=c;px.lineWidth=1.2;px.beginPath();px.ellipse(x,y,r*k,r*k*e,rot,0,6.2832);px.stroke();
    for(let i=0;i<n;i++){const a=t*(.28-ri*.1)+i*6.2832/n;const ex=r*k*Math.cos(a),ey=r*k*e*Math.sin(a);const rx=x+ex*Math.cos(rot)-ey*Math.sin(rot),ry=y+ex*Math.sin(rot)+ey*Math.cos(rot);px.fillStyle=ri?'#ff8a5c':'#5ee0cf';px.shadowColor=px.fillStyle;px.shadowBlur=10;px.fillRect(rx-3,ry-3,6,6);px.shadowBlur=0}});
  requestAnimationFrame(drawPlanet)}
/* ---------- render helpers ---------- */
const ORE={m:'--metal',c:'--crystal',d:'--deut'};const KN={m:'Metal',c:'Crystal',d:'Deuterium'};
const hist={m:[],c:[],d:[]};
function renderRes(){
  const r=I.res();const el=document.getElementById('rt');
  if(!el.children.length)el.innerHTML=['m','c','d'].map(k=>`<div class="panel rtile" style="--c:var(${ORE[k]})" data-k="${k}"><div class="top"><span class="gem"></span><span class="nm">${KN[k]}</span></div><canvas></canvas><div class="big num"></div><div class="rate"></div><div class="bar" style="margin-top:12px"><i></i></div><div class="full"></div></div>`).join('');
  ['m','c','d'].forEach((k,i)=>{const e=el.children[i],v=r[k],cap=I.CAP[k],rate=I.PROD[k],left=(cap-v)/rate,pct=v/cap;
    e.querySelector('.big').innerHTML=I.fmt(v)+`<small>/ ${I.fmt(cap)}</small>`;
    e.querySelector('.rate').innerHTML=`+${rate.toFixed(2)} / tick <span>&middot; ${I.fmt(rate*3600)} / hour</span>`;
    e.querySelector('.bar i').style.width=pct*100+'%';
    e.querySelector('.full').innerHTML=pct>.97?`<b style="color:var(--ember)">STORAGE FULL. Production is wasted.</b>`:`<span>${Math.round(pct*100)}% full</span><span style="color:${left<600?'var(--a300)':'var(--text-3)'}">full in ${I.clock(left)}</span>`;
    e.classList.toggle('warn',pct>.97);
    const h=hist[k];h.push(rate*(.8+Math.random()*.5));if(h.length>40)h.shift();spark(e.querySelector('canvas'),h,getComputedStyle(e).getPropertyValue('--c'))});
}
function spark(c,h,col){const x=c.getContext('2d');c.width=240;c.height=88;x.clearRect(0,0,240,88);const mx=Math.max(...h)*1.1,mn=Math.min(...h)*.8;x.strokeStyle=col.trim()||'#fa0';x.lineWidth=2.4;x.shadowColor=x.strokeStyle;x.shadowBlur=8;x.beginPath();h.forEach((v,i)=>{const px=i/(Math.max(1,h.length-1))*236+2,py=84-(v-mn)/(mx-mn||1)*78;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
function ring(p,txt){const C=2*Math.PI*30;return `<div class="ring"><svg viewBox="0 0 70 70"><circle class="b" cx="35" cy="35" r="30"/><circle class="f" cx="35" cy="35" r="30" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg><b>${txt}</b></div>`}
function costHtml(c){return `<span class="cost">${c.m?`<span class="fe">${I.fmt(c.m)} Fe</span>`:''}${c.c?`<span class="cr">${I.fmt(c.c)} Cr</span>`:''}${c.d?`<span class="de">${I.fmt(c.d)} De</span>`:''}</span>`}
function afford(c){const r=I.res();return r.m>=c.m&&r.c>=c.c&&r.d>=c.d}
function short(c){const r=I.res(),o=[];if(r.m<c.m)o.push(Math.ceil(c.m-r.m)+' Fe');if(r.c<c.c)o.push(Math.ceil(c.c-r.c)+' Cr');if(r.d<c.d)o.push(Math.ceil(c.d-r.d)+' De');return o.join(', ')}
function renderQ(){
  const T=I.tick,a=Q.a,y=Q.yard;let h='';
  // building A
  h+=a?`<div class="panel qc"><div class="ph">Building &middot; slot A</div><div class="bd"><div class="ringw">${ring(Math.min(1,(T-a.s)/(a.e-a.s)),Math.round((T-a.s)/(a.e-a.s)*100)+'%')}<div><div class="cd">${I.clock(a.e-T)}</div><div class="s" style="margin:0">tick ${a.e}</div></div></div><div class="t" style="margin-top:12px">${a.name}</div><div class="s">Level ${a.to-1} &rarr; ${a.to} &middot; +0.31 Cr/tick</div><div style="margin-top:auto"><button class="btn sm" data-x="a">Cancel (refund 70%)</button></div></div></div>`
   :`<div class="panel qc idle"><div class="ph">Building &middot; slot A <span class="badge" style="margin-left:auto">IDLE</span></div><div class="bd"><div class="t">Queue an upgrade</div><div class="s">Mines compound. An idle slot is lost production.</div><div class="sug"><button data-b="Metal Mine"><span>Metal Mine L10<small>+0.4 Fe/t</small></span><span>${costHtml({m:2400,c:600,d:0})}</span></button><button data-b="Defense Grid"><span>Defense Grid L3<small>raid power +40</small></span><span>${costHtml({m:1800,c:900,d:100})}</span></button></div></div></div>`;
  // building B locked
  h+=`<div class="panel qc lock"><div class="ph">Building &middot; slot B</div><div class="bd"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><div class="t" style="margin-top:8px;color:var(--text-2)">Second build slot</div><div class="s">Unlocks with research: Logistics L1<br>Two upgrades at once.</div><a class="btn sm" href="homeworld.html#research">View tech</a></div></div>`;
  // research
  h+=Q.res?`<div class="panel qc"><div class="ph">Research</div><div class="bd"><div class="ringw">${ring(Math.min(1,(T-Q.res.s)/(Q.res.e-Q.res.s)),Math.round((T-Q.res.s)/(Q.res.e-Q.res.s)*100)+'%')}<div><div class="cd">${I.clock(Q.res.e-T)}</div><div class="s" style="margin:0">tick ${Q.res.e}</div></div></div><div class="t" style="margin-top:12px">${Q.res.n}</div><div class="s">Level ${Q.res.to-1} &rarr; ${Q.res.to} &middot; ${Q.res.why}</div></div></div>`
   :`<div class="panel qc idle"><div class="ph">Research <span class="badge" style="margin-left:auto">IDLE</span></div><div class="bd"><div class="t">Nothing in the lab</div><div class="s">Pick one. Costs shown; grey = cannot afford yet.</div><div class="sug">${SUG.map((s,i)=>`<button data-r="${i}" style="${afford(s.cost)?'':'opacity:.5'}"><span>${s.n} L${s.to}<small>${s.why} &middot; ${I.clock(s.t)}</small></span><span>${costHtml(s.cost)}</span></button>`).join('')}</div></div></div>`;
  // shipyard
  const sp=Math.min(1,(T-y.s)/(y.e-y.s));

  document.getElementById('qs').innerHTML=h;
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const s=SUG[+b.dataset.r];if(!afford(s.cost)){I.toast('Cannot afford yet','Short by '+short(s.cost),'red');return}if(I.spend(s.cost)){Q.res={n:s.n,to:s.to,why:s.why,s:I.tick,e:I.tick+Math.round(s.t/6)};I.sfx('ok');I.toast('Research started',s.n+' L'+s.to,'teal');ev('Research started: '+s.n,'teal');renderAll()}});
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const c=b.dataset.b==='Metal Mine'?{m:2400,c:600,d:0}:{m:1800,c:900,d:100};if(!afford(c)){I.toast('Cannot afford yet','Short by '+short(c),'red');return}if(I.spend(c)){Q.a={name:b.dataset.b,to:b.dataset.b==='Metal Mine'?10:3,s:I.tick,e:I.tick+90};I.sfx('ok');ev('Build started: '+b.dataset.b,'teal');renderAll()}});
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{if(b.dataset.x==='a'){Q.a=null;I.toast('Build cancelled','70% refunded','');renderAll()}else I.toast('Queued','+3 corvettes appended (batch)','teal')});
}

const ICO={scout:'<path d="M8 1 L12 14 L8 11 L4 14z"/>',corvette:'<path d="M8 1 L11 8 L14 14 L8 11 L2 14 L5 8z"/>',hauler:'<rect x="3" y="2" width="10" height="12" rx="2"/>',frigate:'<path d="M8 1 L12 6 L14 14 H2 L4 6z"/>'};

let EV=[],filt='all';

function renderEv(){document.getElementById('filters').innerHTML=[['all','All'],['mine','Mine'],['combat','Combat'],['econ','Economy'],['intel','Intel']].map(([k,l])=>`<button class="chip ${filt===k?'on':''}" data-f="${k}">${l}</button>`).join('');

const rc=document.getElementById('radar'),rx=rc.getContext('2d');
function drawRadar(now){const r=rc.getBoundingClientRect();if(!r.width){requestAnimationFrame(drawRadar);return}rc.width=r.width*2;rc.height=r.height*2;rx.setTransform(2,0,0,2,0,0);const Wd=r.width,Hd=r.height,t=now/1000;
  rx.fillStyle='rgba(6,4,6,.6)';rx.fillRect(0,0,Wd,Hd);const cx=Wd/2,cy=Hd/2+8,U=15;const p=(q,r_)=>{const [x,y]=I.px(q-4,r_+2,U);return [cx+x,cy+y]};
  for(let q=-2;q<=10;q++)for(let r_=-8;r_<=4;r_++){if(I.hd({q,r:r_},{q:4,r:-2})>5)continue;const it=I.intel(q,r_);if(!it.known)continue;const s=I.sector(q,r_),[x,y]=p(q,r_);
    rx.fillStyle=s.threat?`${['','#ffd24a','#ff9a2e','#ff5a3c','#ff2e86'][s.threat]}`:'#c58a1a';rx.globalAlpha=.25+.6*it.f;rx.beginPath();rx.arc(x,y,s.threat?3.6:2.2,0,6.2832);rx.fill();rx.globalAlpha=1}
  I.fleets.forEach(f=>{const [x,y]=p(f.loc.q,f.loc.r);rx.fillStyle='#5ee0cf';rx.shadowColor='#5ee0cf';rx.shadowBlur=8;rx.beginPath();rx.moveTo(x,y-6);rx.lineTo(x+4,y+4);rx.lineTo(x-4,y+4);rx.fill();rx.shadowBlur=0});
  const [hx,hy]=p(4,-2);rx.strokeStyle='#ffb000';rx.lineWidth=1.5;rx.beginPath();rx.arc(hx,hy,7+Math.sin(t*2)*1,0,6.2832);rx.stroke();
  rx.strokeStyle='rgba(94,224,207,.25)';const sw=(t*.6)%1;rx.beginPath();rx.arc(hx,hy,sw*80,0,6.2832);rx.stroke();
  // raid vector
  const rp=(raidAt-I.tick)/252;if(rp>0){const [ax,ay]=p(9,-8);rx.strokeStyle='rgba(255,90,60,.8)';rx.setLineDash([4,4]);rx.lineDashOffset=-t*20;rx.beginPath();rx.moveTo(ax,ay);rx.lineTo(hx+(ax-hx)*rp,hy+(ay-hy)*rp);rx.stroke();rx.setLineDash([]);rx.fillStyle='#ff5a3c';const [qx,qy]=[hx+(ax-hx)*rp,hy+(ay-hy)*rp];rx.fillRect(qx-4,qy-4,8,8)}
  requestAnimationFrame(drawRadar)}

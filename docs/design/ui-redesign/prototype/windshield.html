<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IAC Windshield (prototype)</title><link rel="stylesheet" href="iac.css">
<style>
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default}
.ov{position:absolute;z-index:10}
.sechead{left:16px;top:14px;width:330px;pointer-events:none}
.sechead .coord{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.06em;color:var(--a100);line-height:1;text-shadow:0 0 22px rgba(255,176,0,.45)}
.sechead .coord small{font-size:11px;color:var(--text-3);letter-spacing:.3em;display:block;margin-bottom:4px;font-weight:500}
.sechead .chips{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0 8px}
.sechead .voice{max-width:310px;line-height:1.35;opacity:.85}
.threat{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:600;letter-spacing:.14em;font-size:11px;text-transform:uppercase}
.fleetrail{left:16px;top:206px;width:196px;display:flex;flex-direction:column;gap:7px}
.fc{padding:9px 10px 8px;cursor:pointer;transition:.15s var(--ease);position:relative}
.fc:hover{border-color:var(--line-hi);transform:translateX(3px)}
.fc.on{border-color:var(--own);background:linear-gradient(180deg,rgba(20,45,42,.7),rgba(14,24,22,.85))}
.fc.on::before,.fc.on::after{border-color:var(--own)}
.fc .n{display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.06em;color:var(--a200)}
.fc.on .n{color:var(--own)}
.fc .n .key{margin-left:auto}
.fc .m{font-size:10px;color:var(--text-3);margin:3px 0 6px;display:flex;justify-content:space-between}
.fc .st{color:var(--text-2)}
.right{right:16px;top:14px;width:292px;display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 90px)}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:4px 12px 12px}
.g .l{display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);margin-bottom:4px}.g .l b{color:var(--text);font-weight:500}
.g .s{font-size:9.5px;color:var(--text-3);margin-top:3px}
.contacts{overflow:auto;min-height:0;flex:0 1 auto!important}
.ct{display:flex;gap:9px;padding:8px 12px;border-top:1px solid var(--line-lo);cursor:pointer;align-items:flex-start;transition:.12s}
.ct:hover,.ct.hv{background:rgba(255,176,0,.07)}.ct.sel{background:rgba(255,176,0,.13);box-shadow:inset 2px 0 var(--a500)}
.ct .ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;border:1px solid currentColor;font-size:11px;font-weight:700}
.ct .t{font-family:var(--f-display);font-size:12.5px;font-weight:600;letter-spacing:.05em;color:var(--text)}
.ct .d{font-size:10.5px;color:var(--text-3);margin-top:2px;line-height:1.35}
.ct .act{margin-top:7px;display:flex;gap:6px}
.dock{left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:7px;padding:8px;z-index:12;max-width:calc(100% - 20px)}
.ab{position:relative;width:74px;height:62px;border:1px solid var(--line);border-radius:5px;background:rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--a300);overflow:hidden;transition:.14s var(--ease)}
.ab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ab .key{position:absolute;top:4px;right:4px;min-width:15px;height:15px;font-size:9px}
.ab:hover{border-color:var(--a500);background:rgba(255,176,0,.12);transform:translateY(-3px);box-shadow:var(--glow)}
.ab.act{border-color:var(--own);color:var(--own);background:rgba(94,224,207,.1);box-shadow:0 0 16px rgba(94,224,207,.25)}
.ab.fire{color:var(--ember)}.ab.fire:hover{border-color:var(--ember);background:rgba(255,90,60,.14);box-shadow:0 0 18px rgba(255,90,60,.35)}
.ab.dis{opacity:.32;pointer-events:none}
.ab .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.62) calc(var(--p,0)*1turn),transparent 0);pointer-events:none}
.ab .cdn{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:var(--a100);opacity:0;font-weight:600;pointer-events:none}
.ab.cool .cdn{opacity:1}
.hsub{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);display:none;gap:5px;padding:6px;z-index:13}.hsub.on{display:flex}
.feed{left:16px;bottom:14px;width:300px;pointer-events:none;display:flex;flex-direction:column;gap:3px;justify-content:flex-end;font-size:11px}
.feed div{animation:rise .3s var(--ease);padding:3px 8px;border-left:2px solid var(--a600);background:linear-gradient(90deg,rgba(0,0,0,.55),transparent);color:var(--text-2)}
.feed div.red{border-color:var(--ember);color:#ffb3a3}.feed div.teal{border-color:var(--own);color:#b6f2ea}.feed div.violet{border-color:var(--rare);color:#d9c6ff}
.feed div:nth-last-child(n+6){opacity:.35}.feed i{font-style:normal;color:var(--text-4);margin-right:6px}
.banner{left:50%;top:15%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:14;opacity:0}
.banner h1{font-family:var(--f-display);font-weight:700;letter-spacing:.4em;font-size:34px;color:var(--a100);text-shadow:0 0 30px rgba(255,176,0,.8);padding-left:.4em}
.banner p{font-family:var(--f-voice);font-style:italic;color:var(--a300);margin-top:6px;font-size:15px}
.banner.show{animation:bn 2.6s var(--ease)}.banner.red h1{color:#ffd6cc;text-shadow:0 0 30px rgba(255,60,30,.9)}
@keyframes bn{0%{opacity:0;transform:translate(-50%,10px) scale(.96)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}
.gate{position:absolute;z-index:9;width:136px;padding:7px 9px 6px;transform:translate(-50%,-50%);cursor:pointer;transition:transform .18s var(--ease),border-color .15s,box-shadow .15s;font-size:10px;background:linear-gradient(180deg,rgba(28,20,11,.9),rgba(14,10,7,.92))}
.gate:hover,.gate.hv{border-color:var(--a400);box-shadow:0 0 22px rgba(255,176,0,.3);z-index:11}
.gate .top{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.08em;color:var(--a200)}
.gate .top .key{margin-left:auto}
.gate .ln{margin-top:4px;display:flex;align-items:center;gap:6px;color:var(--text-2);line-height:1.25}
.gate .ln.sm{color:var(--text-3);font-size:9.5px}
.gate .ore{display:inline-flex;gap:2px;margin-left:auto}.gate .ore i{width:6px;height:6px;border-radius:50%;background:var(--c);opacity:var(--o)}
.gate.unk{border-style:dashed;background:rgba(10,8,6,.7)}.gate.unk .top{color:var(--text-3)}
.gate.stale{filter:sepia(.6) saturate(.75);border-style:dashed}.gate.stale .top{color:var(--fossil)}
.gate.t3,.gate.t4{border-color:rgba(255,90,60,.55)}.gate.t4{box-shadow:0 0 18px rgba(255,46,134,.25)}
.gate.hot{animation:pulse-b 1.3s infinite}
.live{color:var(--own);font-weight:700;letter-spacing:.1em;font-size:9px}.live::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--own);margin-right:4px;animation:blink 1.4s infinite;box-shadow:0 0 6px var(--own)}
.homebadge{color:var(--own);border:1px solid var(--own-dim);border-radius:3px;padding:0 4px;font-size:9px;letter-spacing:.1em}
.sheetbtn{display:none}
@media (max-width:900px){
  .sechead{width:auto;right:16px}.sechead .voice,.sechead .coord small{display:none}.sechead .coord{font-size:20px}
  .fleetrail{top:auto;bottom:84px;left:8px;right:8px;width:auto;flex-direction:row;overflow-x:auto}.fc{min-width:120px}.fc .m{display:none}
  .right{display:none;left:8px;right:8px;top:70px;width:auto;max-height:55%;z-index:20}.right.on{display:flex}
  .feed{display:none}.dock{bottom:8px;overflow-x:auto;padding:5px;gap:4px}.ab{width:58px;height:54px;flex:none}.ab .key{display:none}
  .gate{width:84px;padding:5px}.gate .ln,.gate .ore{display:none}.gate .top{font-size:10px}
  .sheetbtn{display:inline-flex;position:absolute;top:56px;right:10px;z-index:21}
}
</style></head><body>
<script src="iac.js"></script>
<script>
const I=IAC; I.start();
const main=I.mount('windshield',{badges:{overview:2}});
main.innerHTML=`<canvas id="cv"></canvas><div class="scan"></div><div id="gates"></div>
<div class="ov sechead" id="sechead"></div>
<div class="ov fleetrail" id="fleetrail"></div>
<button class="btn sm sheetbtn" id="sheetbtn">Contacts</button>
<div class="ov right" id="right"><div class="panel"><div class="ph">Fleet status <span class="sub" id="fname"></span></div><div class="gauges" id="gauges"></div></div>
<div class="panel contacts" style="flex:1"><div class="ph">Contacts <span class="sub" id="ccount"></span></div><div id="contacts"></div></div></div>
<div class="ov feed" id="feed"></div>
<div class="ov banner" id="banner"><h1></h1><p></p></div>
<div class="ov hsub panel flat" id="hsub"></div>
<div class="ov dock panel" id="dock"></div>`;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(2,devicePixelRatio||1),cx=0,cy=0,Rh=280,SC=1;
const D=I.DIRS, TAU=Math.PI*2, rnd=(a,b)=>a+Math.random()*(b-a);
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ORE={m:'#d9b46a',c:'#7fd4ff',d:'#6fe6b6'}, OREN={m:'Fe',c:'Cr',d:'De'};
const TERR={empty:'Empty space',asteroid:'Asteroid field',nebula:'Nebula',debris:'Debris field',anomaly:'Anomaly'};
const VOICE={empty:'Quiet. The kind of quiet that listens back.',asteroid:'Rock and silence. Nothing here has been told it is valuable.',nebula:'Cold gas lit from inside. Sensors stutter at the edges.',debris:'Someone lost an argument here. Their hulls are still drifting.',anomaly:'The instruments disagree with each other and with you.'};
const CLS={scout:{px:11,col:1},corvette:{px:15,col:1},frigate:{px:21},cruiser:{px:29},hauler:{px:19}};
const SHAPE={scout:[[0,-1],[.38,.75],[0,.45],[-.38,.75]],corvette:[[0,-1],[.45,.1],[.75,.85],[0,.5],[-.75,.85],[-.45,.1]],
 frigate:[[0,-1.1],[.3,-.4],[.9,.3],[.8,.95],[0,.65],[-.8,.95],[-.9,.3],[-.3,-.4]],
 cruiser:[[0,-1.3],[.35,-.6],[.5,.1],[1,.45],[.85,1.15],[0,.85],[-.85,1.15],[-1,.45],[-.5,.1],[-.35,-.6]],
 hauler:[[-.42,-.95],[.42,-.95],[.62,.95],[-.62,.95]]};

/* ---------------- state ---------------- */
let F=I.fleets[0], fi=0; const local={}; // per-sector mutable overrides
let scene=null, target=null, warp=null, combat=null, harvest=null, boarding=null, pulse=null, shake=0, flash=0, hover=-1, drift=[0,-1], resPick='auto';
const parts=[], shots=[], floats=[];
function units(f){ if(f._u)return f._u; f._u=[];let id=1;for(const [c,n] of f.ships)for(let i=0;i<n;i++){const s=I.STATS[c];f._u.push({id:f.id*100+id++,cls:c,hull:s.hull,hullMax:s.hull,shield:s.shield,shieldMax:s.shield,weapon:s.weapon,x:0,y:0,ang:0,flash:0,dead:false})}return f._u}
const secKey=l=>l.q+','+l.r;
const sec=()=>{const s=Object.assign({},I.sector(F.loc.q,F.loc.r)),l=local[secKey(F.loc)]||{};return Object.assign(s,l)};
const atHome=()=>F.loc.q===I.HOME.q&&F.loc.r===I.HOME.r;
const fpower=f=>units(f).filter(u=>!u.dead).reduce((a,u)=>a+I.POWER[u.cls],0);
function odds(pw,ep){if(!ep)return null;const r=pw/ep;return r>=1.6?{l:'Favoured',c:'tc0',p:88}:r>=1.0?{l:'Even',c:'tc1',p:62}:r>=.7?{l:'Risky',c:'tc2',p:38}:{l:'Outmatched',c:'tc4',p:12}}
const THN=['Clear','Light','Moderate','Heavy','Lethal'], THR=['','I','II','III','IV'];

/* ---------------- scene ---------------- */
function build(){
  const s=sec(), rng=mulberry(Math.floor(I.hash(F.loc.q,F.loc.r,99)*1e9));
  const sc={s,ast:[],clouds:[],bits:[],hostiles:[],salv:null,derelict:null,rings:[],docked:atHome()};
  const oreSum=s.ore.m+s.ore.c+s.ore.d, na=s.terrain==='asteroid'?7+oreSum:s.terrain==='debris'?3:Math.min(4,oreSum);
  for(let i=0;i<na;i++){const a=rng()*TAU,rr=.28+rng()*.55,ot=['m','c','d'].filter(k=>s.ore[k]>0);
    const pick=ot.length?ot[Math.floor(rng()*ot.length)]:null;
    if(Math.abs(Math.cos(a-Math.PI/2))>.9&&rr<.4&&Math.sin(a)>0)continue;
    sc.ast.push({x:Math.cos(a)*rr,y:Math.sin(a)*rr*.9-.05,r:(.035+rng()*.05)*(s.terrain==='asteroid'?1.2:.8),rot:rng()*TAU,vr:(rng()-.5)*.25,ore:pick,seed:rng(),vx:(rng()-.5)*.004,vy:(rng()-.5)*.004,n:7+Math.floor(rng()*4),amt:1})}
  for(let i=0;i<(s.terrain==='nebula'?9:s.terrain==='anomaly'?3:2);i++)sc.clouds.push({x:rng()*2-1,y:rng()*2-1,r:.35+rng()*.5,h:s.terrain==='anomaly'?280+rng()*40:s.terrain==='nebula'?(rng()<.5?20:180)+rng()*40:30,o:rng()*TAU});
  if(s.terrain==='debris')for(let i=0;i<46;i++){sc.bits.push({x:rng()*1.8-.9,y:rng()*1.6-.8,r:.004+rng()*.012,a:rng()*TAU,v:(rng()-.5)*.3})}
  if(s.terrain==='anomaly')for(let i=0;i<3;i++)sc.rings.push({r:.16+i*.12,o:i*1.3});
  if(s.salvage&&!s.salvageTaken){sc.salv={x:-.35+rng()*.15,y:.12,m:s.salvage}}
  if(s.site&&!s.siteDone){sc.derelict={x:.36,y:-.2,tier:s.site.tier,risk:s.site.risk}}
  if(s.threat>0&&!s.cleared){let i=0;for(const [c,n] of s.comp)for(let k=0;k<n;k++){const st=I.STATS[c];sc.hostiles.push({id:900+i++,cls:c,hull:st.hull,hullMax:st.hull,shield:st.shield,shieldMax:st.shield,weapon:st.weapon,x:.0+(rng()-.5)*.5,y:-.5+rng()*.18,ang:Math.PI,flash:0,dead:false,ph:rng()*TAU,bx:0,by:0})}
    sc.hostiles.forEach(h=>{h.bx=h.x;h.by=h.y})}
  scene=sc; target=null; harvest=null; combat=null; boarding=null;
  placeFleet(); renderAll();
}
function formation(i,n){const row=[[0,0],[-1,.9],[1,.9],[-2,1.8],[2,1.8],[0,1.8],[-1,2.7],[1,2.7]];return row[i]||[0,i*.4]}
function placeFleet(){const us=units(F).filter(u=>!u.dead);us.forEach((u,i)=>{const [fx,fy]=formation(i,us.length);u.tx=fx*.1;u.ty=.22+fy*.075;if(u.x===0&&u.y===0){u.x=u.tx;u.y=u.ty}u.ang=0})}
function log(t,c=''){const f=document.getElementById('feed');const d=document.createElement('div');d.className=c;d.innerHTML=`<i>${I.tick%10000}</i>${t}`;f.appendChild(d);while(f.children.length>7)f.firstChild.remove();I.pushEvent('ws',t,c)}
function banner(h,p,cls=''){const b=document.getElementById('banner');b.className='ov banner '+cls;b.querySelector('h1').textContent=h;b.querySelector('p').textContent=p||'';void b.offsetWidth;b.classList.add('show')}

/* ---------------- HUD rendering ---------------- */
function threatBadge(t){return `<span class="threat tc${t}"><span class="tier" data-t="${t}"><i></i><i></i><i></i><i></i></span>${THN[t]}${t?' '+THR[t]:''}</span>`}
function renderHead(){
  const s=scene.s, home=I.hd(F.loc,I.HOME);
  document.getElementById('sechead').innerHTML=`<div class="coord"><small>${atHome()?'HOMEWORLD ORBIT':'SECTOR'}</small>${F.loc.q}, ${F.loc.r}</div>
  <div class="chips"><span class="chip on">${s.zone}</span><span class="chip">${TERR[s.terrain]}</span><span class="chip">${s.d} from hub</span><span class="chip teal">${home===0?'home':home+' from home'}</span></div>
  ${threatBadge(scene.hostiles.length?s.threat:0)}<div class="voice" style="margin-top:9px">${VOICE[s.terrain]}</div>`;
}
function renderFleets(){
  document.getElementById('fleetrail').innerHTML=I.fleets.map((f,i)=>{const hops=Math.floor(f.fuel/f.fuelPerHop);const pol=f.policy==='manual'?'manual':f.policy==='mine_and_return'?'mining':f.policy.replace(/_/g,' ');
   return `<div class="panel fc ${f===F?'on':''}" data-i="${i}"><div class="n"><span style="width:7px;height:7px;background:currentColor;transform:rotate(45deg);box-shadow:0 0 8px currentColor"></span>${f.name}<span class="key">${i+1}</span></div>
   <div class="m"><span class="st">${f.state}${f===F&&combat?' / combat':''}</span><span>${f.loc.q},${f.loc.r}</span></div>
   <div class="bar ${hops<4?'red':'teal'}"><i style="width:${f.fuel/f.fuelMax*100}%"></i></div><div class="m" style="margin:4px 0 0"><span>${hops} hops</span><span>${pol}</span></div></div>`}).join('');
  document.querySelectorAll('.fc').forEach(e=>e.onclick=()=>selFleet(+e.dataset.i));
}
function renderGauges(){
  const us=units(F),cargo=Object.values(F.cargo).reduce((a,b)=>a+b,0),hull=us.reduce((a,u)=>a+u.hull,0),hm=us.reduce((a,u)=>a+u.hullMax,0),sh=us.reduce((a,u)=>a+u.shield,0),sm=us.reduce((a,u)=>a+u.shieldMax,0);
  const home=I.hd(F.loc,I.HOME),need=home*F.fuelPerHop,hops=Math.floor(F.fuel/F.fuelPerHop);
  document.getElementById('fname').textContent=F.name+' / '+us.filter(u=>!u.dead).length+' ships';
  document.getElementById('gauges').innerHTML=`
  <div class="g"><div class="l"><span>FUEL</span><b class="num">${Math.round(F.fuel)}/${F.fuelMax}</b></div><div class="bar ${hops<4?'red':''}"><i style="width:${F.fuel/F.fuelMax*100}%"></i></div><div class="s">${hops} hops &middot; home needs ${need}${F.fuel<need*1.2?' <b class="tc3">LOW</b>':''}</div></div>
  <div class="g"><div class="l"><span>CARGO</span><b class="num">${Math.round(cargo)}/${F.cap}</b></div><div class="bar teal"><i style="width:${cargo/F.cap*100}%"></i></div><div class="s"><span class="fe">Fe ${Math.round(F.cargo.m)}</span> <span class="cr">Cr ${Math.round(F.cargo.c)}</span> <span class="de">De ${Math.round(F.cargo.d)}</span></div></div>
  <div class="g"><div class="l"><span>HULL</span><b class="num">${Math.round(hull/hm*100)}%</b></div><div class="bar ${hull/hm<.5?'red':''}"><i style="width:${hull/hm*100}%"></i></div></div>
  <div class="g"><div class="l"><span>SHIELD</span><b class="num">${Math.round(sh/sm*100)}%</b></div><div class="bar teal"><i style="width:${sh/sm*100}%"></i></div></div>
  <div class="g" style="grid-column:1/3"><div class="l"><span>STANDING ORDERS</span><b>${F.policy==='manual'?'manual':F.policy.replace(/_/g,' ')}</b></div><div class="s">Fleet power <b style="color:var(--text)">${fpower(F)}</b> &middot; scan ${F.ships.some(s=>s[0]==='scout')?'range 2':'range 1'}</div></div>`;
}
function renderContacts(){
  const s=scene.s,rows=[],pw=fpower(F);
  if(scene.hostiles.length){const ep=scene.hostiles.reduce((a,h)=>a+I.POWER[h.cls],0),o=odds(pw,ep),grp={};scene.hostiles.forEach(h=>grp[h.cls]=(grp[h.cls]||0)+1);
    rows.push(`<div class="ct ${target==='h'?'sel':''}" data-k="h"><div class="ico tc${s.threat}">!</div><div><div class="t">${Object.entries(grp).map(([c,n])=>n+'x '+c).join(' + ')}</div><div class="d">${s.behavior} &middot; power ${ep} vs your ${pw}<br><span class="${o.c}">${o.l}</span> &middot; ~${o.p}% win${combat?' &middot; <b class="tc3">ENGAGED</b>':''}</div>${target==='h'?`<div class="act"><button class="btn sm danger" data-do="fire">Fire (F)</button></div>`:''}</div></div>`)}
  const ast=scene.ast.filter(a=>a.ore&&a.amt>0);
  if(ast.length){const ores=['m','c','d'].filter(k=>s.ore[k]>0);
    rows.push(`<div class="ct ${target==='o'?'sel':''}" data-k="o"><div class="ico" style="color:var(--metal)">&#9670;</div><div><div class="t">Ore deposits</div><div class="d">${ores.map(k=>`<span style="color:${ORE[k]}">${OREN[k]} ${'&#9679;'.repeat(s.ore[k])}<span style="opacity:.25">${'&#9679;'.repeat(4-s.ore[k])}</span></span>`).join(' &nbsp;')}<br>${harvest?'<b class="tc0">Harvesting '+harvest.k+'</b>':'Idle &middot; cargo free '+Math.round(F.cap-Object.values(F.cargo).reduce((a,b)=>a+b,0))}</div>${target==='o'?`<div class="act"><button class="btn sm" data-do="harvest">Harvest (H)</button></div>`:''}</div></div>`)}

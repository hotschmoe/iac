<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IAC Star Map (prototype)</title><link rel="stylesheet" href="iac.css">
<style>
.main.mp{background:radial-gradient(70% 70% at 50% 50%,rgba(255,150,30,.05),transparent 75%),#07050a}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#cv.drag{cursor:grabbing}#cv.pick{cursor:crosshair}
.ov{position:absolute;z-index:10}
.tl{left:14px;top:12px;display:flex;flex-direction:column;gap:8px;width:470px}
.tr{right:14px;top:12px;display:flex;gap:0;flex-wrap:wrap;justify-content:flex-end;max-width:56%;border:1px solid var(--line);background:rgba(8,6,4,.9)}
.tgl{display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 9px;border-right:1px solid var(--line-lo);font-family:var(--f-cond);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);cursor:pointer;transition:background .1s,color .1s}
.tr .tgl:last-child{border-right:0}
.tgl:hover{color:var(--a300);background:rgba(255,176,0,.06)}
.tgl::before{content:"";width:6px;height:6px;border:1px solid currentColor}
.tgl.on{color:var(--a200)}.tgl.on::before{background:currentColor;box-shadow:0 0 5px currentColor}
.tgl.threat.on{color:#ffb3a3}
.tgl .key{height:14px;min-width:14px;font-size:8.5px}
.modes .tgl{flex:1;justify-content:center;padding:5px 4px;border:1px solid var(--line)}.modes .tgl::before{display:none}.modes .tgl.on{background:rgba(255,176,0,.14);border-color:var(--a500)}
.fleetchips{display:flex;gap:6px;overflow-x:auto}
.fch{flex:1 1 0;min-width:0;padding:6px 9px;cursor:pointer;text-align:left;transition:border-color .1s,background .1s}
.fch:hover{border-color:var(--line-hi);background:rgba(255,176,0,.05)}.fch.on{border-color:var(--own);background:rgba(94,224,207,.07)}.fch.on::before,.fch.on::after{border-color:var(--own)}
.fch .n{font-family:var(--f-cond);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--a200);display:flex;gap:6px;align-items:center}.fch.on .n{color:var(--own)}
.fch .m{font-size:9.5px;color:var(--text-3);margin-top:2px;text-transform:uppercase}
.rp{right:14px;bottom:14px;width:326px;max-height:calc(100% - 340px)}
.rp{overflow:auto}
.insp{right:14px;top:56px;width:326px}
.row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:11.5px;border-bottom:1px dotted var(--line-lo)}.row .k{color:var(--text-3);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-family:var(--f-cond)}
.strip{display:flex;gap:2px;margin:6px 0 4px}.strip i{flex:1;height:18px;background:var(--c,#333);position:relative;opacity:var(--o,1);display:grid;place-items:center;font-style:normal;font-family:var(--f-cond);font-weight:700;font-size:9px;color:#120a02}
.strip i.stale{background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.55) 0 1.5px,transparent 1.5px 4px)}
.strip i.hold::after{content:"";position:absolute;right:-2px;top:-4px;bottom:-4px;width:2px;background:var(--a100)}
.modes{display:flex;gap:4px;margin:8px 0}
.fossil{background:repeating-linear-gradient(135deg,rgba(138,117,82,.12) 0 2px,transparent 2px 6px);border:1px dashed #6f5c3e;padding:6px 9px;color:#c9b284;font-size:10.5px;margin:6px 0;display:flex;gap:7px;align-items:center;text-transform:uppercase;letter-spacing:.03em}
.livebox{border:1px solid var(--own-dim);padding:6px 9px;color:var(--own);font-size:10.5px;margin:6px 0;text-transform:uppercase;letter-spacing:.03em}
.ab2{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.legend{left:14px;bottom:14px;width:262px}
.legend .pb{padding:6px 12px 10px;font-size:10px;color:var(--text-2)}
.lg{display:flex;align-items:center;gap:8px;margin:5px 0;flex-wrap:wrap;text-transform:uppercase;letter-spacing:.04em}
.tscale{display:flex;gap:1px;margin:4px 0 2px}.tscale i{flex:1;height:14px;background:var(--c);display:grid;place-items:center;font-style:normal;font-family:var(--f-cond);font-weight:700;font-size:9px;color:#120a02}
.fresh-bar{height:6px;background:linear-gradient(90deg,#ffcf5a,#d99a2a 40%,#8a7552 80%,#4a4030);margin:2px 0;border:1px solid var(--line)}
.zoomc{left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:0;align-items:center;padding:0}
.zoomc .ibtn{width:32px;height:32px;font-family:var(--f-mono);font-size:16px;border:0;border-right:1px solid var(--line-lo)}
.coords{font-size:10.5px;color:var(--text-2);min-width:200px;text-align:center;text-transform:uppercase;letter-spacing:.04em}
.tip{position:absolute;z-index:12;pointer-events:none;padding:5px 9px;font-size:10.5px;background:rgba(10,8,6,.95);border:1px solid var(--line-hi);transform:translate(14px,14px);white-space:nowrap}
.preview{margin-top:8px;padding:6px 8px;border:1px solid var(--line);background:rgba(0,0,0,.4);font-size:10.5px;line-height:1.55;color:var(--text-2);text-transform:uppercase;letter-spacing:.02em}
.preview b{font-weight:500}
@media (max-width:900px){
 .tl{width:auto;right:10px;left:10px}.fleetchips .m{display:none}.tr{top:auto;bottom:128px;right:8px;max-width:none;left:8px;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}.tgl{flex:none}
 .insp{top:auto;bottom:8px;left:8px;right:8px;width:auto;max-height:42%;overflow:auto}.rp{display:none!important}.legend{display:none}.zoomc{bottom:auto;top:62px;left:auto;right:8px;transform:none;flex-direction:column}.zoomc .ibtn{border-right:0;border-bottom:1px solid var(--line-lo)}.coords{display:none}
}
</style></head><body>
<script src="iac.js"></script>
<script>
const I=IAC; I.start();
const main=I.mount('map',{badges:{overview:2}});
main.classList.add('mp');
const TS=[...Array(9)].map((_,i)=>`<i style="--c:var(--t${i+1})">${i+1}</i>`).join('');
main.innerHTML=`<canvas id="cv"></canvas><div class="scan"></div>
<div class="ov tl"><div class="fleetchips" id="fchips"></div></div>
<div class="ov tr" id="layers"></div>
<div class="ov panel insp" id="insp"></div>
<div class="ov panel rp" id="rp" style="display:none"></div>
<div class="ov panel legend" id="legend"><div class="ph">Legend</div><div class="pb">
 <div class="lbl">Threat rating</div><div class="tscale">${TS}</div><div style="display:flex;justify-content:space-between;font-size:8.5px;color:var(--text-3)"><span>LOW</span><span>NPC POWER x2 PER STEP</span><span>LETHAL</span></div>
 <div class="lbl" style="margin-top:9px">Intel age</div><div class="fresh-bar"></div><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-3)"><span>LIVE</span><span>5m</span><span>30m</span><span>FOSSIL</span></div>
 <div class="lg" style="margin-top:9px"><span style="color:var(--own)">${I.sym('fleet',{s:14,w:1.6})} fleet</span><span style="color:var(--t6)">${I.sym('diamond',{s:14,w:1.6})} hostile</span><span style="color:var(--a400)">${I.sym('salvage',{s:14,w:1.8})} salvage</span><span style="color:var(--rare)">${I.sym('derelict',{s:16,w:1.6})} derelict</span><span style="color:var(--metal)">${I.sym('ore',{s:14,w:1.6})} ore</span></div></div></div>
<div class="ov panel zoomc"><button class="ibtn" id="zo">&minus;</button><div class="coords num" id="coords">-</div><button class="ibtn" id="zi">+</button><button class="ibtn" id="zh" title="Home (H)" style="width:auto;padding:0 10px;font-family:var(--f-cond);font-size:10px;letter-spacing:.14em">HOME</button><button class="ibtn" id="zf" title="Fleet (F)" style="width:auto;padding:0 10px;font-family:var(--f-cond);font-size:10px;letter-spacing:.14em;border-right:0">FLEET</button></div>
<div class="tip" id="tip" style="display:none"></div>`;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(2,devicePixelRatio||1);
const U=26, TAU=Math.PI*2, RMAX=22;
const view={x:0,y:0,s:1.15};
const layers={threat:false,ore:false,age:true,lanes:true,derelict:true,zones:true};
let F=I.fleets[0],mode='balanced',hoverHex=null,selHex=null,pending=null,preview=null,moving=null,holdOn=true,held=null,time=0;
const THRGB=['74,140,130','79,185,168','127,207,138','201,216,90','255,210,74','255,154,46','255,106,60','255,64,64','255,46,134','208,75,255'];
const THC=['#4a8c82','#4fb9a8','#7fcf8a','#c9d85a','#ffd24a','#ff9a2e','#ff6a3c','#ff4040','#ff2e86','#d04bff'];
const ORE={m:'#d9b46a',c:'#7fd4ff',d:'#6fe6b6'},OREC={m:'217,180,106',c:'127,212,255',d:'111,230,182'},TERR={empty:'Empty space',asteroid:'Asteroid field',nebula:'Nebula',debris:'Debris field',anomaly:'Anomaly'};
const AB={scout:'SCT',corvette:'COR',frigate:'FRG',cruiser:'CRU',hauler:'HLR'};
const K=I.K, SQ3=Math.sqrt(3);
const toS=(q,r)=>{const [x,y]=I.px(q,r,U);return [W/2+(x-view.x)*view.s,H/2+(y-view.y)*view.s]};
const toH=(sx,sy)=>{const x=(sx-W/2)/view.s+view.x,y=(sy-H/2)/view.s+view.y;const q=(2/3*x)/U,r=(-1/3*x+SQ3/3*y)/U;let rq=Math.round(q),rr=Math.round(r),rs=Math.round(-q-r);const dq=Math.abs(rq-q),dr=Math.abs(rr-r),ds=Math.abs(rs+q+r);if(dq>dr&&dq>ds)rq=-rr-rs;else if(dr>ds)rr=-rq-rs;return {q:rq,r:rr}};
const hexes=[];for(let q=-RMAX;q<=RMAX;q++)for(let r=-RMAX;r<=RMAX;r++)if(I.dist(q,r)<=RMAX)hexes.push({q,r});
const hat=document.createElement('canvas');hat.width=hat.height=8;{const g=hat.getContext('2d');g.strokeStyle='rgba(7,5,10,.9)';g.lineWidth=1.2;g.beginPath();g.moveTo(-1,9);g.lineTo(9,-1);g.moveTo(-1,5);g.lineTo(5,-1);g.moveTo(3,9);g.lineTo(9,3);g.stroke()}
let hatP=null;
const power=f=>f.ships.reduce((a,[c,n])=>a+I.POWER[c]*n,0);
const mixc=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
function resize(){const r=main.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;hatP=ctx.createPattern(hat,'repeat')}
addEventListener('resize',resize);

/* ---------- drawing ---------- */
function hexPath(x,y,r){ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;i?ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r):ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath()}
function ringPath(d){ctx.beginPath();const c=[[d,-d],[d,0],[0,d],[-d,d],[-d,0],[0,-d]];c.forEach(([q,r],i)=>{const [x,y]=toS(q,r);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath()}
function sym(d,x,y,s,col,a,lw,rot){I.vstroke(ctx,d,x,y,s,rot||0,col,a,lw||1.2,s>12?1:0)}
function bg(){
  ctx.fillStyle='#07050a';ctx.fillRect(0,0,W,H);
  /* plotter registration marks every 4 sectors (graticule) */
  const step=4*U*view.s*1.5;if(step>28){const ox=((W/2-view.x*view.s)%step+step)%step,oy=((H/2-view.y*view.s)%step+step)%step;ctx.strokeStyle='rgba(255,176,0,.10)';ctx.lineWidth=1;ctx.beginPath();for(let x=ox-step;x<W+step;x+=step)for(let y=oy-step;y<H+step;y+=step){ctx.moveTo(x-3,y);ctx.lineTo(x+3,y);ctx.moveTo(x,y-3);ctx.lineTo(x,y+3)}ctx.stroke()}
}
function drawZones(){
  if(!layers.zones)return;
  /* hub spokes with sector-distance ticks */
  const [hx,hy]=toS(0,0);ctx.lineWidth=1;
  [[0,-1],[1,-1],[1,0],[0,1],[-1,1],[-1,0]].forEach(([dq,dr])=>{const [ex,ey]=toS(dq*RMAX,dr*RMAX);ctx.strokeStyle='rgba(255,176,0,.10)';ctx.setLineDash([2,6]);ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([]);
    if(view.s>.5){ctx.strokeStyle='rgba(255,176,0,.3)';ctx.beginPath();for(let d=4;d<=RMAX;d+=4){const [tx,ty]=toS(dq*d,dr*d);const nx=-(ey-hy),ny=ex-hx,L=Math.hypot(nx,ny);ctx.moveTo(tx-nx/L*3,ty-ny/L*3);ctx.lineTo(tx+nx/L*3,ty+ny/L*3)}ctx.stroke()}});
  [8,20].forEach((d,i)=>{ringPath(d);ctx.setLineDash([8,6]);ctx.lineDashOffset=0;ctx.strokeStyle=i?'rgba(255,90,60,.5)':'rgba(255,176,0,.5)';ctx.lineWidth=1.2;ctx.stroke();ctx.setLineDash([])});
  if(view.s>.5){const lab=[[8,'R08  INNER RING','255,176,0'],[20,'R20  OUTER RING','255,90,60']];lab.forEach(([d,t,c])=>{const [x,y]=toS(0,-d);ctx.fillStyle=`rgba(${c},.85)`;ctx.font='600 10px "IBM Plex Sans Condensed"';ctx.textAlign='center';ctx.fillText(t.split('').join(' '),x,y-8)});
    const [x,y]=toS(0,-RMAX);ctx.fillStyle='rgba(183,147,255,.7)';ctx.font='600 10px "IBM Plex Sans Condensed"';ctx.fillText('R22+  THE WANDERING'.split('').join(' '),x,y-10)}
}
function frame(now){
  time=now/1000;ctx.setTransform(DPR,0,0,DPR,0,0);bg();drawZones();
  const hr=U*view.s*.96;
  const lastP=pending?pending.full:null;
  const rn=hr*.5;
  const vis=[];
  for(const h of hexes){const [x,y]=toS(h.q,h.r);if(x<-60||y<-60||x>W+60||y>H+60)continue;
    const it=I.intel(h.q,h.r);if(!it.known)continue;const s=I.sector(h.q,h.r);vis.push({h,x,y,it,s});
    const f=it.f,base=mixc([255,176,0],[138,117,82],1-f);
    if(view.s>=.7){hexPath(x,y,hr*.98);ctx.strokeStyle=`rgba(${base},${.05+.05*f})`;ctx.lineWidth=1;ctx.stroke()}
    if(layers.threat){const c=THRGB[s.threat];
      if(s.threat>0){hexPath(x,y,hr*.98);ctx.fillStyle=`rgba(${c},${(.2+.055*s.threat)*(.4+.6*f)+(it.state==='live'?.06:0)})`;ctx.fill();if(s.threat>=4){ctx.save();ctx.clip();ctx.strokeStyle=`rgba(${c},.28)`;ctx.lineWidth=1;ctx.beginPath();for(let k=-hr*2;k<hr*2;k+=Math.max(4,9-s.threat)){ctx.moveTo(x+k,y+hr);ctx.lineTo(x+k+hr*2,y-hr)}ctx.stroke();ctx.restore()}
        for(let k=0;k<Math.floor((s.threat-1)/3);k++){hexPath(x,y,hr*(1.12+k*.16));ctx.strokeStyle=`rgba(${c},${.3+.3*f})`;ctx.lineWidth=1;ctx.stroke()}}
      else{hexPath(x,y,hr*.98);ctx.fillStyle=`rgba(${c},${.05+.05*f})`;ctx.fill()}}
    if(layers.lanes)for(const n of I.lanesOf(h.q,h.r)){if(n.q<h.q||(n.q===h.q&&n.r<h.r))continue;const ni=I.intel(n.q,n.r);const [nx,ny]=toS(n.q,n.r);
      const kn=ni.known,fl=Math.min(f,kn?ni.f:.25);const dx=nx-x,dy=ny-y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
      ctx.strokeStyle=`rgba(${mixc([255,196,80],[138,117,82],1-fl)},${.22+.55*fl})`;ctx.lineWidth=Math.max(1,view.s*1.1);
      if(!kn||it.state==='stale'||ni.state==='stale')ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(x+ux*rn,y+uy*rn);ctx.lineTo(nx-ux*rn*(kn?1:.4),ny-uy*rn*(kn?1:.4));ctx.stroke();ctx.setLineDash([])}}
  /* frontier hints: dashed bracket, '?' */
  if(view.s>.8){const seenFr=new Set();for(const v of vis){for(const n of I.lanesOf(v.h.q,v.h.r)){const k=K(n.q,n.r);if(I.seen.has(k)||seenFr.has(k))continue;seenFr.add(k);const [x,y]=toS(n.q,n.r);
    ctx.setLineDash([2,3]);ctx.strokeStyle='rgba(183,147,255,.5)';ctx.lineWidth=1;hexPath(x,y,rn*.75);ctx.stroke();ctx.setLineDash([]);if(view.s>1.1){ctx.fillStyle='rgba(183,147,255,.7)';ctx.font='500 11px "IBM Plex Mono"';ctx.textAlign='center';ctx.fillText('?',x,y+4)}}}}
  if(layers.threat){ctx.fillStyle='rgba(6,4,8,.4)';ctx.fillRect(0,0,W,H)}
  const near=view.s>=1.0;
  for(const {h,x,y,it,s} of vis){const f=it.f,live=it.state==='live',stale=it.state==='stale',aging=it.state==='aging';
    const base=mixc([255,176,0],[138,117,82],1-f);const tc=s.threat>0?THRGB[s.threat]:null;
    hexPath(x,y,rn);ctx.fillStyle=tc?`rgba(${tc},${.07+.02*s.threat})`:`rgba(14,10,6,.95)`;ctx.fill();
    if(!tc){ctx.fillStyle=`rgba(${base},${.04+.08*f})`;ctx.fill()}
    if(stale||aging){ctx.fillStyle=hatP;ctx.globalAlpha=stale?.9:.4;ctx.fill();ctx.globalAlpha=1}
    const col=tc?tc:live?'94,224,207':base.join(',');
    ctx.lineWidth=(live?1.5:1.2)+(s.threat>=5?.6:0);ctx.strokeStyle=`rgba(${col},${.4+.55*f})`;if(stale)ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
    if(live||s.threat>=5){ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`rgba(${col},.12)`;ctx.lineWidth=4.5;hexPath(x,y,rn);ctx.stroke();ctx.restore()}
    if(s.threat>=5&&!stale&&view.s>=.55){const on=Math.floor(time*2+h.q)%2===0;ctx.strokeStyle=`rgba(${tc},${on?.6:.2})`;ctx.lineWidth=1;hexPath(x,y,rn*1.4);ctx.stroke()}
    if(s.threat>0&&view.s>=.55){
      if(view.s>=.8){ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.strokeStyle=`rgba(${tc},${.5+.4*f})`;ctx.lineWidth=1;const dq=rn*.62;ctx.strokeRect(-dq,-dq,dq*2,dq*2);ctx.restore()}
      ctx.fillStyle=f>.5?'#fff3e8':'#e6d5b8';ctx.font='700 '+Math.max(9,Math.round(rn*.9))+'px "IBM Plex Sans Condensed"';ctx.textAlign='center';ctx.fillText(s.threat,x,y+rn*.33)}
    else if(s.terrain==='anomaly'&&view.s>=.7){ctx.strokeStyle='rgba(183,147,255,.85)';ctx.lineWidth=1;const a=rn*.5;ctx.beginPath();ctx.moveTo(x-a,y);ctx.lineTo(x+a,y);ctx.moveTo(x,y-a);ctx.lineTo(x,y+a);ctx.moveTo(x-a*.7,y-a*.7);ctx.lineTo(x+a*.7,y+a*.7);ctx.moveTo(x+a*.7,y-a*.7);ctx.lineTo(x-a*.7,y+a*.7);ctx.stroke()}
    else if(view.s>=.7){ctx.fillStyle=`rgba(${col},${.4+.4*f})`;ctx.fillRect(x-1,y-1,2,2)}
    if(near||layers.ore){const oy=y+rn*1.35;['m','c','d'].forEach((k,i)=>{const dn=s.ore[k];if(!dn)return;const bw=Math.max(3,hr*.15),bx=x+(i-1)*bw*1.6,bh=2+dn*(layers.ore?hr*.1:hr*.065);ctx.strokeStyle=`rgba(${OREC[k]},${Math.max(.35,f)})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(bx,oy+rn*.4);ctx.lineTo(bx,oy+rn*.4-bh);ctx.stroke()})}
    if(near){if(s.salvage)sym(I.SYM.salvage,x-rn*1.2,y-rn*.75,Math.max(6,hr*.3),'255,190,60',Math.max(.5,f),1.2);
      if(s.site&&layers.derelict)sym(I.SYM.derelict,x+rn*1.3,y-rn*.6,Math.max(8,hr*.4),'183,147,255',Math.max(.6,f),1.1);
      if(view.s>1.6&&it.age>6){ctx.fillStyle=stale?'#c9b284':'rgba(255,226,170,.5)';ctx.font='400 '+Math.round(hr*.26)+'px "IBM Plex Mono"';ctx.textAlign='center';ctx.fillText(I.ago(it.age),x,y-rn*1.25)}}
    else if(s.site&&layers.derelict&&view.s>=.62){ctx.strokeStyle='rgba(183,147,255,.95)';ctx.lineWidth=1;ctx.strokeRect(x+rn*1.0,y-rn*1.1,4,4)}
    if(s.salvage&&!near&&view.s>=.62){ctx.fillStyle='rgba(255,190,60,.95)';ctx.fillRect(x-rn*1.4,y-rn*1.1,4,4)}
  }
  /* home: wireframe planet + orbit */
  {const [x,y]=toS(I.HOME.q,I.HOME.r),r=Math.max(10,hr*.62);sym(I.SYM.home,x,y,r*1.55,'255,200,100',1,1.3);ctx.strokeStyle='rgba(94,224,207,.9)';ctx.lineWidth=1.2;ctx.strokeRect(x-r*1.55*.95-2,y-r*.3,0,0);
    ctx.fillStyle='#5ee0cf';ctx.font='600 '+Math.max(9,Math.round(hr*.34))+'px "IBM Plex Sans Condensed"';ctx.textAlign='center';ctx.fillText('HOME',x,y+r*1.7)}
  /* hub */
  {const [x,y]=toS(0,0);sym(I.SYM.hub,x,y,Math.max(10,hr*.9),'255,226,163',.9,1.2);ctx.fillStyle='rgba(255,226,163,.8)';ctx.font='600 10px "IBM Plex Sans Condensed"';ctx.textAlign='center';if(view.s>.5)ctx.fillText('C E N T R A L   H U B',x,y-hr*1.3)}

    for(let i=0;i<6;i++){const a0=i*Math.PI/3,a1=(i+1)*Math.PI/3,p0=[x+Math.cos(a0)*r,y+Math.sin(a0)*r],p1=[x+Math.cos(a1)*r,y+Math.sin(a1)*r];ctx.beginPath();ctx.moveTo(p0[0]+(p1[0]-p0[0])*0,p0[1]);ctx.moveTo(p0[0],p0[1]);ctx.lineTo(p0[0]+(p1[0]-p0[0])*.4,p0[1]+(p1[1]-p0[1])*.4);ctx.stroke();ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p1[0]-(p1[0]-p0[0])*.4,p1[1]-(p1[1]-p0[1])*.4);ctx.stroke()}});

function fpos(f){if(moving&&moving.f===f){const a=moving.from,b=moving.to,p=Math.min(1,(performance.now()-moving.t0)/moving.dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;return {q:a.q+(b.q-a.q)*e,r:a.r+(b.r-a.r)*e}}return f.loc}

  const r=Math.max(8,hr*.5),ox=f.loc.q===I.HOME.q&&f.loc.r===I.HOME.r?hr*.8:0,fx=x+ox,fy=y-ox*.4;

  sym(I.SYM.fleet,fx,fy,r*1.25,c,1,1.5,ang);
  if(view.s>=.7&&(sel||view.s>1.6)){ctx.fillStyle=`rgba(${c},1)`;ctx.font='600 '+Math.max(9,Math.round(hr*.32))+'px "IBM Plex Sans Condensed"';ctx.textAlign='center';ctx.fillText(f.name.toUpperCase().split('').join(' '),fx,fy-r*2.3)}}
function drawRoutes(){
  const drawPath=(pts,col,dash,w)=>{if(pts.length<2)return;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash(dash);ctx.lineDashOffset=-time*26;ctx.beginPath();pts.forEach((p,i)=>{const [x,y]=toS(p.q,p.r);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.restore()};

  if(pending){let prev=o;pending.full.forEach((p,i)=>{const s=I.sector(p.q,p.r),it=I.intel(p.q,p.r);const t=it.known?s.threat:0;const col=t>0?THC[t]:'#ffd27a';
      const [x1,y1]=toS(prev.q,prev.r),[x2,y2]=toS(p.q,p.r);ctx.save();ctx.strokeStyle='rgba(0,0,0,.75)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=2.4;ctx.setLineDash([7,5]);ctx.lineDashOffset=-time*28;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
      /* hop number tick */
      if(view.s>=.9){const mx=(x1+x2)/2,my=(y1+y2)/2;ctx.fillStyle='rgba(7,5,10,.9)';ctx.fillRect(mx-6,my-6,12,12);ctx.strokeStyle=col;ctx.lineWidth=1;ctx.strokeRect(mx-6,my-6,12,12);ctx.fillStyle=col;ctx.font='500 8.5px "IBM Plex Mono"';ctx.textAlign='center';ctx.fillText(i+1,mx,my+3)}prev=p});
    pending.wps.forEach((w,i)=>{const [x,y]=toS(w.q,w.r);ctx.strokeStyle='#ffe2a3';ctx.fillStyle='#07050a';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-24);ctx.stroke();ctx.fillRect(x,y-30,15,12);ctx.strokeRect(x,y-30,15,12);ctx.fillStyle='#ffe2a3';ctx.font='500 9px "IBM Plex Mono"';ctx.textAlign='center';ctx.fillText(i+1,x+7.5,y-21)});
    pending.stats.hold&&pending.stats.hold.forEach(ix=>{const p=pending.full[ix];if(!p)return;const [x,y]=toS(p.q,p.r);const r=Math.max(9,U*view.s*.55);ctx.strokeStyle='#fff3d6';ctx.lineWidth=1.4;ctx.beginPath();for(let k=0;k<4;k++){const a=k*Math.PI/2+Math.PI/4;k?ctx.lineTo(x+Math.cos(a)*r*1.3,y+Math.sin(a)*r*1.3):ctx.moveTo(x+Math.cos(a)*r*1.3,y+Math.sin(a)*r*1.3)}ctx.closePath();ctx.stroke();ctx.fillStyle='#fff3d6';ctx.font='600 9px "IBM Plex Sans Condensed"';ctx.textAlign='center';ctx.fillText('H O L D',x,y-r*1.55)})}
}
function endMark(p,c){const [x,y]=toS(p.q,p.r);const r=U*view.s*.6;ctx.strokeStyle=c;ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();ctx.beginPath();ctx.moveTo(x-r*1.5,y);ctx.lineTo(x-r*.6,y);ctx.moveTo(x+r*.6,y);ctx.lineTo(x+r*1.5,y);ctx.moveTo(x,y-r*1.5);ctx.lineTo(x,y-r*.6);ctx.moveTo(x,y+r*.6);ctx.lineTo(x,y+r*1.5);ctx.stroke()}

/* ---------- routing ---------- */
function originOf(){return pending&&pending.wps.length?pending.wps[pending.wps.length-1]:F.loc}
function plan(dest,append){
  const o=append?originOf():F.loc;const path=I.route(o,dest,mode);if(!path||!path.length)return null;
  const wps=append&&pending?[...pending.wps,dest]:[dest];const full=append&&pending?[...pending.full,...path]:path;
  return {wps,full,stats:I.routeStats(F,full),mode}}
function alt(dest,m){const p=I.route(F.loc,dest,m);return p&&p.length?{path:p,stats:I.routeStats(F,p)}:null}
function renderRoute(){
  const el=document.getElementById('rp');const R=pending?{full:pending.full,stats:pending.stats,dest:pending.wps[pending.wps.length-1]}:preview?{full:preview.path,stats:preview.stats,dest:preview.dest}:null;

  const dsec=I.sector(R.dest.q,R.dest.r),dit=I.intel(R.dest.q,R.dest.r),di=dsec.threat&&dit.known?I.ratioInfo(pw,dsec.power):null;

   <div class="modes">${altS.map(({m,a})=>`<button class="tgl ${m===mode?'on':''}" data-m="${m}" title="${a?a.stats.hops+' hops, max threat '+(a.stats.maxT?'T'+a.stats.maxT:'clear'):''}">${m}${a?`<span style="opacity:.6">&nbsp;${a.stats.hops}</span>`:''}</button>`).join('')}</div>
   <div class="row"><span class="k">Hops</span><b class="num">${st.hops}</b></div>
   <div class="row"><span class="k">Fuel</span><b class="num ${st.canMake?'':'tc7'}">${st.fuel} <span style="color:var(--text-3);font-weight:400">of ${Math.round(F.fuel)}</span></b></div>
   <div class="bar ${fuelPct<20?'red':''}" style="margin:4px 0 8px"><i style="width:${fuelPct}%"></i></div>
   <div class="row" style="font-size:10.5px"><span class="k">Return trip</span><span class="${st.canReturn?'tc1':'tc7'}">${st.canReturn?'OK, margin '+(st.fuelLeft-st.back)+' fuel':'<b>NO FUEL TO COME HOME</b> (needs '+st.back+')'}</span></div>
   <div class="row"><span class="k">ETA</span><b class="num">${I.clock(st.hops*2)}</b></div>
   <div class="row" style="margin-top:4px"><span class="k">Threat along route</span>${I.thr(st.maxT,{sm:1})}</div>
   <div class="strip">${secs.map((x,i)=>{const t=x.it.known?x.s.threat:-1;return `<i class="${x.it.state==='stale'||x.it.state==='aging'?'stale':''} ${st.hold.includes(i)?'hold':''}" style="--c:${t<0?'#4a4030':t===0?'#2f6b62':THC[t]};--o:${x.it.state==='stale'?.7:1}" title="${x.p.q},${x.p.r}">${t>0?t:''}</i>`}).join('')}</div>
   <div style="font-size:10px;color:var(--text-3);text-transform:uppercase">${st.hostile} hostile sector${st.hostile===1?'':'s'} &middot; ${secs.filter(x=>!x.it.known||x.it.state==='stale').length} on stale or missing intel</div>
   ${wi?`<div class="row" style="margin-top:6px"><span class="k">Worst ratio</span><b class="${wi.c}">${wi.r.toFixed(2)} ${wi.l} <span style="color:var(--text-3);font-weight:400">vs T${worst.s.threat}</span></b></div>${I.ratioGauge(wi.r)}`:''}
   <div class="preview">&gt; SECTOR (${R.dest.q},${R.dest.r}) THREAT ${dit.known?(dsec.threat?'T'+dsec.threat:'CLEAR'):'UNKNOWN'}${dsec.threat&&dit.known?`, EST NPC POWER ${dsec.power}, FLEET ${pw}, RATIO ${di.r.toFixed(1)} <b class="${di.c}">${di.l}</b>`:''}. FUEL ${st.fuel} OF ${Math.round(F.fuel)} (${Math.max(0,Math.floor((F.fuel-st.fuel)/F.fuelPerHop))} HOPS LEFT TO RETURN)<span class="cur"></span></div>
   <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:11px;color:var(--text-2);cursor:pointer;text-transform:uppercase;letter-spacing:.03em"><input type="checkbox" id="holdc" ${holdOn?'checked':''} style="accent-color:var(--a500)"> Hold before T5+ sectors (${st.hold.length})</label>
   ${pending?`<div class="ab2"><button class="btn primary" id="go" ${st.canMake?'':'disabled'}>Engage <span class="key">&#9166;</span></button><button class="btn" id="clr">Clear <span class="key">esc</span></button></div><div style="font-size:10px;color:var(--text-3);margin-top:6px">Shift+click to add a waypoint.</div>`:'<div style="font-size:10px;color:var(--text-3);margin-top:8px">Click to set destination. Shift+click adds a waypoint.</div>'}
  </div>`;
  el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;I.sfx('click');if(pending){const d=pending.wps[pending.wps.length-1];pending=plan(d,false)||pending}else if(preview){preview=prevFor(preview.dest)}renderRoute()});

function prevFor(d){const path=I.route(F.loc,d,mode);return path&&path.length?{dest:d,path,stats:I.routeStats(F,path)}:null}
function clearPlan(){pending=null;preview=null;renderRoute()}
function engage(){if(!pending)return;if(!pending.stats.canMake){I.toast('Not enough fuel','Route needs '+pending.stats.fuel+', fleet has '+Math.round(F.fuel),'red');return}
  F.route=[...pending.full];F.state='Moving';held=null;I.sfx('jump');I.toast('Route engaged',`${F.name}: ${pending.full.length} hops, ${I.clock(pending.stats.hops*2)}`,'teal');const p=pending;pending=null;activePlan=p;stepRoute();renderRoute();renderChips()}

    const ss=I.sector(n.q,n.r);if(ss.threat>0&&!(ss.threat>=5))I.toast('Contact',`T${ss.threat} hostiles at ${n.q},${n.r}`,'red');
    if(!F.route.length){F.state='Idle';I.toast('Arrived',`${F.name} at ${F.loc.q},${F.loc.r}`,'teal');I.sfx('ok');activePlan=null;renderInsp();renderChips()}else{stepRoute()}renderChips();if(selHex)renderInsp()},1100)}
function showHeld(){const el=document.getElementById('rp');el.style.display='block';const s=held.s,o=I.ratioInfo(power(F),s.power);

  document.querySelectorAll('.fch').forEach(e=>e.onclick=()=>{F=I.fleets[+e.dataset.i];pending=null;preview=null;held=null;renderChips();renderRoute();I.sfx('click')})}
function renderLayers(){const L=[['threat','Threat','l'],['ore','Ore','o'],['age','Intel age','i'],['lanes','Lanes','n'],['derelict','Derelicts','d'],['zones','Zones','z']];

function renderInsp(){

   <div style="display:flex;align-items:baseline;gap:10px"><span style="font-family:var(--f-cond);font-weight:700;font-size:26px;color:var(--a100);letter-spacing:.04em">${h.q}, ${h.r}</span><span class="chip">${it.known?TERR[s.terrain]:'Uncharted'}</span></div>
   ${!it.known?`<div class="fossil" style="border-color:#5c4690;color:var(--rare);background:none">No data. A scout must visit, or a scan from an adjacent sector will reveal it.</div>`:
    it.state==='live'?`<div class="livebox"><span class="live">LIVE</span> in sensor range &middot; hostiles shown are real</div>`:
    `<div class="fossil"><span>&#9201;</span><span><b>Seen ${I.ago(it.age)} ago.</b> Hostiles may have moved; ore may have been mined.</span></div>`}
   ${it.known?`<div class="row"><span class="k">Threat</span>${I.thr(s.threat)}</div>
   ${s.threat?`<div class="row" style="font-size:11px"><span class="tc${s.threat}">${s.comp.map(([c,n])=>n+'x '+AB[c]).join(' + ')}</span><span style="color:var(--text-3);text-transform:uppercase">${s.behavior}</span></div><div class="row"><span class="k">Ratio</span><span class="${odds.c}"><b>${odds.r.toFixed(2)} ${odds.l}</b> <span style="color:var(--text-3)">${s.power} vs ${pw}</span></span></div>${I.ratioGauge(odds.r)}`:''}
   ${bar('m','Metal')}${bar('c','Crystal')}${bar('d','Deut')}
   <div style="font-size:10px;color:var(--text-3);margin:4px 0 4px;text-transform:uppercase">${rich>=expect*3?'Rich for this distance':rich<=expect?'Poor for this distance':'Typical for this distance'} &middot; loot tier x${s.loot}</div>
   ${s.salvage?`<div class="row"><span class="k" style="color:var(--a400)">Salvage</span><span><span class="fe">${s.salvage.m}</span> <span class="cr">${s.salvage.c}</span> <span class="de">${s.salvage.d}</span></span></div>`:''}
   ${s.site?`<div class="row"><span class="k" style="color:var(--rare)">Derelict</span><span>tier ${s.site.tier} &middot; risk <b style="color:${s.site.risk==='hot'?'var(--ember)':s.site.risk==='uneasy'?'var(--t5)':'var(--ok)'}">${s.site.risk}</b></span></div>`:''}`:''}
   <div class="row"><span class="k">Distance</span><span class="num" style="text-align:right">${hops} from ${F.name}<br>${home} from home &middot; ${s.d} from hub</span></div>
   <div class="ab2"><button class="btn primary sm" id="rt">Route here</button><button class="btn sm" id="wpb">+ Waypoint</button>${it.known&&it.state!=='live'?'<button class="btn sm" id="scn">Refresh intel</button>':''}</div></div>`;
  const rt=document.getElementById('rt');if(rt)rt.onclick=()=>setDest(h,false);const wb=document.getElementById('wpb');if(wb)wb.onclick=()=>setDest(h,true);const sc=document.getElementById('scn');if(sc)sc.onclick=()=>{I.toast('Scout dispatched','Prospector will refresh intel at '+h.q+','+h.r,'teal')}}
function setDest(h,append){const p=plan(h,append&&pending);if(!p){I.toast('No known lane','There is no charted path to '+h.q+','+h.r+'. Scan from a nearby sector first.','red');return}pending=p;preview=null;I.sfx('ok');renderRoute()}

/* ---------- interaction ---------- */
let drag=null,pts=new Map(),pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY});if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.s};drag=null}else drag={x:e.offsetX,y:e.offsetY,vx:view.x,vy:view.y,moved:false,sh:e.shiftKey}});
cv.addEventListener('pointermove',e=>{pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(pinch&&pts.size===2){const [a,b]=[...pts.values()];view.s=Math.max(.25,Math.min(4,pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));return}
  if(drag){const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;if(drag.moved){view.x=drag.vx-dx/view.s;view.y=drag.vy-dy/view.s;cv.classList.add('drag')}}
  const h=toH(e.offsetX,e.offsetY);if(!hoverHex||h.q!==hoverHex.q||h.r!==hoverHex.r){hoverHex=I.dist(h.q,h.r)<=RMAX?h:null;if(!drag||!drag.moved){if(hoverHex&&!pending){preview=prevFor(hoverHex)}renderRoute();if(!selHex)renderInsp()}}
  document.getElementById('coords').textContent=hoverHex?`${hoverHex.q}, ${hoverHex.r}  /  R${String(I.dist(hoverHex.q,hoverHex.r)).padStart(2,'0')}  /  ZOOM ${view.s.toFixed(2)}`:'';});
cv.addEventListener('pointerup',e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;cv.classList.remove('drag');
  if(drag&&!drag.moved&&hoverHex){const h=hoverHex;selHex=h;renderInsp();
    if(e.shiftKey&&pending)setDest(h,true);else if(I.intel(h.q,h.r).known||I.neighbors(h.q,h.r).some(n=>I.seen.has(K(n.q,n.r))&&n.lane))setDest(h,false);}
  drag=null});
cv.addEventListener('pointerleave',()=>{if(!drag){hoverHex=null;preview=pending?null:null;renderRoute();if(!selHex)renderInsp()}});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,Math.exp(-e.deltaY*.0015))},{passive:false});
function zoomAt(sx,sy,f){const wx=(sx-W/2)/view.s+view.x,wy=(sy-H/2)/view.s+view.y;view.s=Math.max(.25,Math.min(4,view.s*f));view.x=wx-(sx-W/2)/view.s;view.y=wy-(sy-H/2)/view.s}
function center(l,s){const [x,y]=I.px(l.q,l.r,U);const x0=view.x,y0=view.y,s0=view.s,t0=performance.now();(function st(){const p=Math.min(1,(performance.now()-t0)/500),e=1-Math.pow(1-p,3);view.x=x0+(x-x0)*e;view.y=y0+(y-y0)*e;if(s)view.s=s0+(s-s0)*e;if(p<1)requestAnimationFrame(st)})()}
document.getElementById('zi').onclick=()=>zoomAt(W/2,H/2,1.3);document.getElementById('zo').onclick=()=>zoomAt(W/2,H/2,1/1.3);
document.getElementById('zh').onclick=()=>center(I.HOME,1.3);document.getElementById('zf').onclick=()=>center(F.loc,1.5);
window.IAC_NO_M=false;
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey)return;const k=e.key.toLowerCase();
  const L={l:'threat',o:'ore',i:'age',n:'lanes',d:'derelict',z:'zones'};if(L[k]){layers[L[k]]=!layers[L[k]];renderLayers();return}
  if(k==='enter'){if(held)return;engage();return}if(k==='escape'){clearPlan();selHex=null;renderInsp();return}
  if(k==='h'){center(I.HOME,1.3);return}if(k==='f'){center(F.loc,1.5);return}if(k==='+'||k==='='){zoomAt(W/2,H/2,1.25);return}if(k==='-'){zoomAt(W/2,H/2,.8);return}
  if(k==='0'){center({q:0,r:0},.5);return}
  if(['1','2','3'].includes(k)){F=I.fleets[+k-1];pending=null;preview=null;renderChips();renderRoute();return}
  if(k==='tab'){e.preventDefault();F=I.fleets[(I.fleets.indexOf(F)+1)%3];pending=null;renderChips();renderRoute();return}
  if(k==='arrowleft')view.x-=60/view.s;if(k==='arrowright')view.x+=60/view.s;if(k==='arrowup')view.y-=60/view.s;if(k==='arrowdown')view.y+=60/view.s;});
I.onTick(()=>{renderChips();if(selHex)renderInsp();if(F.route&&F.route.length&&!moving&&!held&&activePlan)stepRoute()});

resize();const [hx,hy]=I.px(5,-3,U);view.x=hx;view.y=hy;renderChips();renderLayers();renderInsp();requestAnimationFrame(frame);
if(location.hash.includes('threat'))layers.threat=true,renderLayers();
window.__map={view,layers,setSel:h=>{selHex=h;hoverHex=h;renderInsp()},dest:h=>{setDest(h,false)},sel:h=>{selHex=h;renderInsp()},zoom:s=>{view.s=s},center,engage,get pending(){return pending},renderLayers};
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IAC Windshield (prototype)</title><link rel="stylesheet" href="iac.css">
<style>
.main.ws{background:radial-gradient(62% 60% at 50% 50%,rgba(var(--zt,255,150,30),.085),transparent 70%),#07050a}
#cv,#cv2{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv2{pointer-events:none}
#cv{cursor:default}
.main.retrace #cv,.main.retrace #cv2{animation:retrace .5s cubic-bezier(.6,0,.4,1)}
@keyframes retrace{0%{transform:scaleY(1);filter:brightness(1)}38%{transform:scaleY(.012);filter:brightness(3.2)}62%{transform:scaleY(.012);filter:brightness(3.2)}100%{transform:scaleY(1);filter:brightness(1)}}
.alarm{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;box-shadow:inset 0 0 90px 10px rgba(255,60,30,.38);transition:opacity .2s steps(4)}
.alarm.on{opacity:1;animation:flick 1.3s steps(1) infinite}
.ov{position:absolute;z-index:10}
.sechead{left:16px;top:14px;width:300px;pointer-events:none}
.sechead .coord{font-family:var(--f-cond);font-weight:700;font-size:36px;letter-spacing:.06em;color:var(--a100);line-height:1;text-shadow:0 0 12px rgba(255,176,0,.3);margin:3px 0 8px}
.sechead .kv{padding:2px 0;font-size:11px}
.sechead .kv .v{font-size:11px}
.sechead .thrline{display:flex;align-items:center;gap:10px;margin:8px 0 4px;font-family:var(--f-cond);font-weight:600;letter-spacing:.14em;font-size:11px;text-transform:uppercase}
.sechead .voice{margin-top:6px;max-width:330px;line-height:1.45}
.fleetrail{left:16px;top:230px;width:208px;display:flex;flex-direction:column;gap:6px}
.fc{padding:7px 10px 6px;cursor:pointer;transition:border-color .12s,background .12s}
.fc:hover{border-color:var(--line-hi);background:rgba(255,176,0,.06)}
.fc.on{border-color:var(--own);background:rgba(94,224,207,.07)}
.fc.on::before,.fc.on::after{border-color:var(--own)}
.fc .n{display:flex;align-items:center;gap:7px;font-family:var(--f-cond);font-weight:600;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--a200)}
.fc.on .n{color:var(--own)}
.fc .n .key{margin-left:auto}
.fc .m{font-size:10px;color:var(--text-3);margin:3px 0 5px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.04em}
.fc .st{color:var(--text-2)}
.right{right:16px;top:14px;width:300px;display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 100px)}
.dials{display:flex;justify-content:space-around;padding:6px 4px 0}
.grows{padding:2px 12px 10px}
.gr{margin:7px 0 0}.gr .l{display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);margin-bottom:3px;font-family:var(--f-cond);letter-spacing:.16em;text-transform:uppercase}.gr .l b{color:var(--text);font-weight:500;font-family:var(--f-mono);letter-spacing:.02em}
.contacts{overflow:auto;min-height:0;flex:0 1 auto!important}
.ct{display:flex;gap:10px;padding:8px 12px;border-top:1px solid var(--line-lo);cursor:pointer;align-items:flex-start;transition:background .1s}
.ct:hover{background:rgba(255,176,0,.07)}.ct.sel{background:rgba(255,176,0,.12);box-shadow:inset 3px 0 var(--a500)}
.ct .ico{width:28px;flex:none;display:grid;place-items:center;padding-top:1px}
.ct .t{font-family:var(--f-cond);font-size:12.5px;font-weight:600;letter-spacing:.1em;color:var(--text);text-transform:uppercase}
.ct .d{font-size:10.5px;color:var(--text-3);margin-top:3px;line-height:1.5;text-transform:uppercase;letter-spacing:.02em}
.ct .act{margin-top:7px;display:flex;gap:6px}
.dm{width:28px;height:28px;position:relative;display:grid;place-items:center;font-family:var(--f-cond);font-weight:700;font-size:13px}
.dm::before{content:"";position:absolute;inset:4px;border:1.4px solid currentColor;transform:rotate(45deg)}
.dm b{position:relative;font-weight:700}
.dock{left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:0;padding:0;z-index:12;max-width:calc(100% - 20px)}
.ab{position:relative;width:76px;height:60px;border-right:1px solid var(--line-lo);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--f-cond);font-weight:600;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--a300);overflow:hidden;transition:background .1s,color .1s}
.ab:last-child{border-right:0}
.ab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:square;stroke-linejoin:miter}
.ab .key{position:absolute;top:3px;right:3px;min-width:14px;height:14px;font-size:9px}
.ab:hover{background:var(--a500);color:#1c1000}.ab:hover .key{color:#1c1000;border-color:rgba(0,0,0,.5)}
.ab.act{background:rgba(94,224,207,.14);color:var(--own);box-shadow:inset 0 -2px var(--own)}
.ab.fire{color:var(--ember)}.ab.fire:hover{background:var(--ember);color:#1c0500}
.ab.dis{opacity:.28;pointer-events:none}
.ab .cd{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.72) calc(var(--p,0)*100%),transparent 0);pointer-events:none}
.ab .cdn{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:16px;color:var(--a100);opacity:0;font-weight:500;pointer-events:none}
.ab.cool .cdn{opacity:1}
.hsub{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);display:none;gap:0;padding:0;z-index:13}.hsub.on{display:flex}
.hsub .btn{border:0;border-right:1px solid var(--line-lo)}.hsub .btn:last-child{border-right:0}
.feed{left:16px;bottom:14px;width:340px;pointer-events:none;display:flex;flex-direction:column;gap:1px;justify-content:flex-end;font-size:10.5px;line-height:1.35;text-transform:uppercase;letter-spacing:.02em}
.feed div{animation:rise .4s steps(26);padding:1px 6px;color:var(--text-2);background:rgba(7,5,10,.55)}
.feed div.red{color:#ff9a86}.feed div.teal{color:#8eeadf}.feed div.violet{color:#cdb7ff}
.feed div:nth-last-child(n+7){opacity:.4}.feed i{font-style:normal;color:var(--text-4);margin-right:8px}
.feed div::before{content:">";color:var(--a600);margin-right:6px}
.feed .cur{margin-left:6px;width:.55em;height:.9em;vertical-align:-1px}
.banner{left:50%;top:21%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:14;opacity:0;padding:12px 34px 11px;background:rgba(7,5,10,.78);border:1px solid var(--line-hi)}
.banner h1{font-family:var(--f-cond);font-weight:700;letter-spacing:.34em;font-size:32px;color:var(--a100);text-shadow:0 0 14px rgba(255,176,0,.45);padding-left:.34em;white-space:nowrap}
.banner p{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--a300);margin-top:6px}
.banner.show{animation:bn 2.8s linear}.banner.red{border-color:var(--ember)}.banner.red h1{color:#ffd6cc;text-shadow:0 0 14px rgba(255,60,30,.6)}.banner.red p{color:#ff9a86}
@keyframes bn{0%{opacity:0;clip-path:inset(48% 0 48% 0)}8%{opacity:1;clip-path:inset(0)}84%{opacity:1;clip-path:inset(0)}100%{opacity:0;clip-path:inset(0)}}
.gate{position:absolute;z-index:9;width:150px;padding:0;transform:translate(-50%,-50%);cursor:pointer;transition:border-color .12s,background .12s;font-size:10px;background:rgba(9,6,4,.94);border:1px solid var(--line)}
.gate::before,.gate::after{display:none}
.gate:hover,.gate.hv{border-color:var(--a400);background:rgba(40,28,10,.96);z-index:11}
.gate .top{display:flex;align-items:center;gap:6px;padding:4px 6px 3px;border-bottom:1px solid var(--line-lo);font-family:var(--f-cond);font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--a200);text-transform:uppercase}
.gate .top .key{height:15px;min-width:15px}
.gate .top .brg{margin-left:auto;font-family:var(--f-mono);font-weight:400;font-size:9px;letter-spacing:.04em;color:var(--text-3)}
.gate .ln{padding:3px 6px 0;display:flex;align-items:center;gap:6px;color:var(--text-2);line-height:1.25;text-transform:uppercase;letter-spacing:.03em}
.gate .ln.sm{color:var(--text-3);font-size:9.5px;padding-bottom:4px}
.gate .ore{display:inline-flex;gap:2px;margin-left:auto;align-items:flex-end;height:10px}.gate .ore i{width:4px;background:var(--c);height:var(--h)}
.gate.unk{border-style:dashed;background:rgba(7,5,4,.8)}.gate.unk .top{color:var(--text-3)}
.gate.stale{border-style:dashed}.gate.stale .top{color:var(--fossil)}
.gate.hot{animation:pulse-b 1.3s steps(1) infinite}
.live{color:var(--own);font-weight:600;letter-spacing:.12em;font-size:9px}.live::before{content:"";display:inline-block;width:6px;height:6px;background:var(--own);margin-right:5px;animation:blink 1.4s steps(1) infinite;box-shadow:0 0 6px var(--own)}
.homebadge{color:var(--own);border:1px solid var(--own-dim);padding:0 4px;font-size:9px;letter-spacing:.1em}
.sheetbtn{display:none}
@media (max-width:900px){
  .sechead{width:auto;right:16px}.sechead .voice,.sechead .kv,.sechead .coord small{display:none}.sechead .coord{font-size:22px;margin:0}
  .sechead .thrline{margin:3px 0 0}
  .fleetrail{top:auto;bottom:80px;left:8px;right:8px;width:auto;flex-direction:row;gap:4px}.fc{flex:1;min-width:0;padding:5px 6px}.fc .n{font-size:10.5px;letter-spacing:.04em;gap:4px}.fc .n .key,.fc .n .sy{display:none}.fc .m{display:none}
  .right{display:none;left:8px;right:8px;top:70px;width:auto;max-height:55%;z-index:20}.right.on{display:flex}
  .feed{display:none}.dock{bottom:6px;left:6px;right:6px;transform:none;max-width:none}.ab{flex:1;width:auto;min-width:0;height:52px;font-size:8px;letter-spacing:.04em}.ab .key{display:none}
  .gate{width:92px}.gate .ln,.gate .ore,.gate .top .brg{display:none}.gate .top{font-size:9.5px;border-bottom:0;padding:3px 4px}
  .sheetbtn{display:inline-flex;position:absolute;top:52px;right:10px;z-index:21;background:#0a0705}
  .banner{padding:8px 16px}.banner h1{font-size:20px}
}
</style></head><body>
<script src="iac.js"></script>
<script>
const I=IAC; I.start();
const main=I.mount('windshield',{badges:{overview:2}});
main.classList.add('ws');
main.innerHTML=`<canvas id="cv"></canvas><canvas id="cv2"></canvas><div class="scan"></div><div class="alarm" id="alarm"></div><div id="gates"></div>
<div class="ov sechead" id="sechead"></div>
<div class="ov fleetrail" id="fleetrail"></div>
<button class="btn sm sheetbtn" id="sheetbtn">Status</button>
<div class="ov right" id="right"><div class="panel"><div class="ph">Fleet status <span class="sub" id="fname"></span></div><div id="gauges"></div></div>
<div class="panel contacts" style="flex:1"><div class="ph">Contacts <span class="sub" id="ccount"></span></div><div id="contacts"></div></div></div>
<div class="ov feed" id="feed"></div>
<div class="ov banner" id="banner"><h1></h1><p></p></div>
<div class="ov hsub panel flat" id="hsub"></div>
<div class="ov dock panel" id="dock"></div>`;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),cv2=document.getElementById('cv2'),c2=cv2.getContext('2d');
const RED=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W=0,H=0,DPR=Math.min(2,devicePixelRatio||1),cx=0,cy=0,Rh=280,SC=1;
const D=I.DIRS, TAU=Math.PI*2, rnd=(a,b)=>a+Math.random()*(b-a);
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* rgb triples for canvas; hex for DOM */
const RGB={amber:'255,176,0',gold:'255,204,102',own:'94,224,207',ember:'255,90,60',violet:'183,147,255',cyan:'127,212,255',pale:'255,226,163',m:'217,180,106',c:'127,212,255',d:'111,230,182'};
const THRGB=['255,190,60','79,185,168','127,207,138','201,216,90','255,210,74','255,154,46','255,106,60','255,64,64','255,46,134','208,75,255'];
const ORE={m:'#d9b46a',c:'#7fd4ff',d:'#6fe6b6'}, OREN={m:'Fe',c:'Cr',d:'De'};
const AB={scout:'SCT',corvette:'COR',frigate:'FRG',cruiser:'CRU',hauler:'HLR'};
const TERR={empty:'Empty space',asteroid:'Asteroid field',nebula:'Nebula',debris:'Debris field',anomaly:'Anomaly'};
const VOICE={empty:'Sector quiet. No signal above background.',asteroid:'Rock field. Ore signatures logged.',nebula:'Ionised gas. Sensor range reduced.',debris:'Hull fragments. Salvage possible.',anomaly:'Instruments disagree. Readings unreliable.'};
const CLS={scout:{px:11},corvette:{px:15},frigate:{px:21},cruiser:{px:29},hauler:{px:19}};
const BRG=['000','060','120','180','240','300'];

/* ---------------- state ---------------- */
let F=I.fleets[0], fi=0; const local={};
let scene=null, target=null, warp=null, combat=null, harvest=null, boarding=null, pulse=null, shake=0, hover=-1, drift=[0,-1], resPick='auto', retr=0;
const parts=[], shots=[], floats=[], rings=[], frags=[];
function units(f){ if(f._u)return f._u; f._u=[];let id=1;for(const [c,n] of f.ships)for(let i=0;i<n;i++){const s=I.STATS[c];f._u.push({id:f.id*100+id++,cls:c,hull:s.hull,hullMax:s.hull,shield:s.shield,shieldMax:s.shield,weapon:s.weapon,x:0,y:0,ang:0,flash:0,dead:false})}return f._u}
const secKey=l=>l.q+','+l.r;
const sec=()=>{const s=Object.assign({},I.sector(F.loc.q,F.loc.r)),l=local[secKey(F.loc)]||{};return Object.assign(s,l)};
const atHome=()=>F.loc.q===I.HOME.q&&F.loc.r===I.HOME.r;
const fpower=f=>units(f).filter(u=>!u.dead).reduce((a,u)=>a+I.POWER[u.cls],0);
const hpower=()=>scene.s.power||scene.hostiles.reduce((a,h)=>a+I.POWER[h.cls],0);

/* ---------------- scene ---------------- */
function build(){
  const s=sec(), rng=mulberry(Math.floor(I.hash(F.loc.q,F.loc.r,99)*1e9));
  const sc={s,ast:[],bits:[],hostiles:[],salv:null,derelict:null,rings:[],docked:atHome(),gas:[]};
  const oreSum=s.ore.m+s.ore.c+s.ore.d, na=s.terrain==='asteroid'?7+oreSum:s.terrain==='debris'?3:Math.min(4,oreSum);
  for(let i=0;i<na;i++){const a=rng()*TAU,rr=.28+rng()*.55,ot=['m','c','d'].filter(k=>s.ore[k]>0);
    const pick=ot.length?ot[Math.floor(rng()*ot.length)]:null;
    if(Math.abs(Math.cos(a-Math.PI/2))>.9&&rr<.4&&Math.sin(a)>0)continue;
    sc.ast.push({x:Math.cos(a)*rr,y:Math.sin(a)*rr*.9-.05,r:(.035+rng()*.05)*(s.terrain==='asteroid'?1.2:.8),rot:rng()*TAU,vr:(rng()-.5)*.25,ore:pick,seed:rng(),vx:(rng()-.5)*.004,vy:(rng()-.5)*.004,n:7+Math.floor(rng()*4),amt:1})}
  /* nebula / anomaly: contour lines instead of gas clouds */
  for(let i=0;i<(s.terrain==='nebula'?3:0);i++)sc.gas.push({x:rng()*1.2-.6,y:rng()*1.0-.5,r:.18+rng()*.22,o:rng()*TAU,n:5+Math.floor(rng()*3)});
  if(s.terrain==='debris')for(let i=0;i<46;i++){sc.bits.push({x:rng()*1.8-.9,y:rng()*1.6-.8,r:.004+rng()*.012,a:rng()*TAU,v:(rng()-.5)*.3})}
  if(s.terrain==='anomaly')for(let i=0;i<4;i++)sc.rings.push({r:.12+i*.09,o:i*1.3});
  if(s.salvage&&!s.salvageTaken){sc.salv={x:-.35+rng()*.15,y:.12,m:s.salvage}}
  if(s.site&&!s.siteDone){sc.derelict={x:.36,y:-.2,tier:s.site.tier,risk:s.site.risk}}
  if(s.threat>0&&!s.cleared){let i=0;const m=s.m||1;for(const [c,n] of s.comp)for(let k=0;k<n;k++){const st=I.STATS[c];sc.hostiles.push({id:900+i++,cls:c,hull:Math.round(st.hull*m),hullMax:Math.round(st.hull*m),shield:Math.round(st.shield*m),shieldMax:Math.round(st.shield*m),weapon:st.weapon*m,x:.0+(rng()-.5)*.5,y:-.5+rng()*.18,ang:Math.PI,flash:0,dead:false,ph:rng()*TAU,bx:0,by:0})}
    sc.hostiles.forEach(h=>{h.bx=h.x;h.by=h.y})}
  scene=sc; target=null; harvest=null; combat=null; boarding=null;
  const zt=s.zone==='Inner Ring'?'255,150,30':s.zone==='Outer Ring'?'255,90,40':s.zone==='The Wandering'?'160,90,255':'255,176,0';main.style.setProperty('--zt',zt);
  placeFleet(); renderAll();
}
function formation(i,n){const row=[[0,0],[-1,.9],[1,.9],[-2,1.8],[2,1.8],[0,1.8],[-1,2.7],[1,2.7]];return row[i]||[0,i*.4]}
function placeFleet(){const us=units(F).filter(u=>!u.dead);us.forEach((u,i)=>{const [fx,fy]=formation(i,us.length);u.tx=fx*.1;u.ty=.22+fy*.075;if(u.x===0&&u.y===0){u.x=u.tx;u.y=u.ty}u.ang=0})}
let logCur=null;
function log(t,c=''){const f=document.getElementById('feed');if(logCur)logCur.remove();const d=document.createElement('div');d.className=c;d.innerHTML=`<i>${String(I.tick%100000).padStart(5,'0')}</i>${t}`;f.appendChild(d);while(f.children.length>7)f.firstChild.remove();logCur=document.createElement('span');logCur.className='cur';d.appendChild(logCur);I.pushEvent('ws',t,c)}
function banner(h,p,cls=''){const b=document.getElementById('banner');b.className='ov banner '+cls;b.querySelector('h1').textContent=h;b.querySelector('p').textContent=p||'';void b.offsetWidth;b.classList.add('show')}

/* ---------------- HUD rendering ---------------- */
function renderHead(){
  const s=scene.s, home=I.hd(F.loc,I.HOME), th=scene.hostiles.length?s.threat:0;
  document.getElementById('sechead').innerHTML=`<div class="lbl">${atHome()?'Homeworld orbit':'Sector'}</div><div class="coord">${F.loc.q}, ${F.loc.r}</div>
  <div class="kv"><span class="k">Zone</span><span class="v">${s.zone}</span></div><div class="kv"><span class="k">Terrain</span><span class="v">${TERR[s.terrain]}</span></div><div class="kv"><span class="k">Range</span><span class="v">${s.d} from hub &middot; ${home===0?'at home':home+' from home'}</span></div>
  <div class="thrline"><span class="lbl" style="letter-spacing:.18em">Threat</span>${I.thr(th)}<span class="tc${th}">${th?'':'Clear'}</span></div><div class="voice">${VOICE[s.terrain]}</div>`;
}
function renderFleets(){
  document.getElementById('fleetrail').innerHTML=I.fleets.map((f,i)=>{const hops=Math.floor(f.fuel/f.fuelPerHop);const pol=f.policy==='manual'?'manual':f.policy==='mine_and_return'?'mining':f.policy.replace(/_/g,' ');
   return `<div class="panel fc ${f===F?'on':''}" data-i="${i}"><div class="n">${I.sym('fleet',{s:12,w:1.6})}${f.name}<span class="key">${i+1}</span></div>
   <div class="m"><span class="st">${f.state}${f===F&&combat?' / combat':''}</span><span>${f.loc.q},${f.loc.r}</span></div>
   <div class="bar ${hops<4?'red':'teal'}"><i style="width:${f.fuel/f.fuelMax*100}%"></i></div><div class="m" style="margin:5px 0 0"><span>${hops} hops</span><span>${pol}</span></div></div>`}).join('');
  document.querySelectorAll('.fc').forEach(e=>e.onclick=()=>selFleet(+e.dataset.i));
}
let gFleet=null;
function renderGauges(){
  const us=units(F),cargo=Object.values(F.cargo).reduce((a,b)=>a+b,0),hull=us.reduce((a,u)=>a+u.hull,0),hm=us.reduce((a,u)=>a+u.hullMax,0),sh=us.reduce((a,u)=>a+u.shield,0),sm=us.reduce((a,u)=>a+u.shieldMax,0);
  const home=I.hd(F.loc,I.HOME),need=home*F.fuelPerHop,hops=Math.floor(F.fuel/F.fuelPerHop);
  document.getElementById('fname').textContent=F.name+' / '+us.filter(u=>!u.dead).length+' ships';
  const el=document.getElementById('gauges');
  if(gFleet!==F||!document.getElementById('grows')){gFleet=F;el.innerHTML=`<div class="dials">${I.dial({id:'dFuel',label:'FUEL',frac:F.fuel/F.fuelMax,warn:.2,val:Math.round(F.fuel)+'/'+F.fuelMax,w:112})}${I.dial({id:'dHull',label:'HULL',frac:hull/hm,warn:.3,val:Math.round(hull/hm*100)+'%',w:112,col:'var(--own)'})}</div><div class="grows" id="grows"></div>`}
  I.dialSet('dFuel',F.fuel/F.fuelMax,Math.round(F.fuel)+'/'+F.fuelMax);I.dialSet('dHull',hull/hm,Math.round(hull/hm*100)+'%');
  document.getElementById('grows').innerHTML=`
  <div class="gr"><div class="l"><span>Cargo</span><b class="num">${I.digits(cargo,3)}/${F.cap}</b></div><div class="bar teal"><i style="width:${cargo/F.cap*100}%"></i></div><div style="font-size:10px;margin-top:5px"><span class="fe">Fe ${Math.round(F.cargo.m)}</span> &nbsp;<span class="cr">Cr ${Math.round(F.cargo.c)}</span> &nbsp;<span class="de">De ${Math.round(F.cargo.d)}</span></div></div>

    else{const m=units(F).find(u=>!u.dead);if(m){const dx=m.x-h.x,dy=m.y-h.y;h.ang=Math.atan2(dx,-dy)}h.y+=(-.34+((i%2)*.1)-h.y)*.02;h.x+=((i-(scene.hostiles.length-1)/2)*.24-h.x)*.02}
    h.flash*=.9;drawShip(h,true,t);const [x,y]=wp(h.x,h.y);
    if(target==='h'||hoverT==='h'||combat){const r=CLS[h.cls].px*SC*2.1;c2.save();c2.translate(x,y);c2.rotate(Math.PI/4);c2.strokeStyle=`rgba(${RGB.ember},${combat?.55+.35*Math.sin(t*8+i):.8})`;c2.lineWidth=1.1;c2.strokeRect(-r*.8,-r*.8,r*1.6,r*1.6);c2.restore();if(i===0&&!combat)reticle(c2,x,y,r*1.15,RGB.ember,'HOSTILE T'+scene.s.threat)}});
  /* own fleet (persistence layer) */
  units(F).forEach(u=>{if(u.dead)return;u.flash*=.9;const idle=!warp;let bob=idle?Math.sin(t*1.2+u.id)*.004:0;
    if(warp){const p=Math.max(0,(now-warp.t0)/1100);const dirx=Math.cos(warp.ang),diry=Math.sin(warp.ang);if(p<.5){const e=Math.pow(p/.5,2.2);u.x=u.tx+dirx*e*1.0;u.y=u.ty+diry*e*1.0}else{const e=Math.min(1,(p-.5)/.5),k=1-Math.pow(1-e,3);u.x=(u.tx-dirx*1.15)*(1-k)+u.tx*k;u.y=(u.ty-diry*1.15)*(1-k)+u.ty*k}u.ang=Math.atan2(diry,dirx)+Math.PI/2}
    else{u.ang=combat?0:u.ang*.9;u.y+=bob}
    drawShip(u,false,t);if(!warp)u.y-=bob});
  /* harvest beams: dashed plotter lines */
  if(harvest&&!warp){const us=units(F).filter(u=>!u.dead),as=scene.ast.filter(a=>a.ore&&a.amt>0);if(as.length){c2.save();c2.setLineDash([3,4]);c2.lineDashOffset=-t*40;us.forEach((u,i)=>{const a=as[i%as.length],[x1,y1]=wp(u.x,u.y),[x2,y2]=wp(a.x,a.y);c2.strokeStyle=`rgba(${a.ore==='m'?RGB.m:a.ore==='c'?RGB.c:RGB.d},.8)`;c2.lineWidth=1.2;c2.beginPath();c2.moveTo(x1,y1-8);c2.lineTo(x2,y2);c2.stroke();
    if(Math.random()<.3)parts.push({x:a.x,y:a.y,vx:(u.x-a.x)*.9,vy:(u.y-a.y)*.9,l:.5,m:.5,c:a.ore==='m'?RGB.m:a.ore==='c'?RGB.c:RGB.d,len:.015})});c2.restore()}}
  /* shots: bright line with leading head */
  for(let i=shots.length-1;i>=0;i--){const s=shots[i],p=(now-s.t0)/s.dur;if(s.a.dead||s.t.dead){shots.splice(i,1);continue}
    const x1=cx+s.a.x*Rh,y1=cy+s.a.y*Rh,x2=cx+s.t.x*Rh,y2=cy+s.t.y*Rh;
    if(p>=1){impact(s);shots.splice(i,1);continue}
    const q=Math.max(0,p),q0=Math.max(0,p-.22),col=s.side?'159,255,240':'255,122,92';line(c2,x1+(x2-x1)*q0,y1+(y2-y1)*q0,x1+(x2-x1)*q,y1+(y2-y1)*q,col,1,1.6,2);c2.fillStyle=`rgba(${col},1)`;c2.fillRect(x1+(x2-x1)*q-1.5,y1+(y2-y1)*q-1.5,3,3)}
  /* scan: PPI beam sweep with decaying wedge, expanding hex range ring */
  if(pulse){const p=(now-pulse.t0)/1600;if(p>1)pulse=null;else{const [ux,uy]=wp(0,.24),ang=-Math.PI/2+p*TAU*1.5,L=Rh*1.15*Math.min(1,p*3.5);
    for(let k=0;k<22;k++){const a=ang-k*.045;c2.strokeStyle=`rgba(${RGB.own},${(1-k/22)*.5*(1-p*.6)})`;c2.lineWidth=1.3;c2.beginPath();c2.moveTo(ux,uy);c2.lineTo(ux+Math.cos(a)*L,uy+Math.sin(a)*L);c2.stroke()}
    c2.strokeStyle=`rgba(${RGB.own},${(1-p)*.9})`;c2.lineWidth=1.4;c2.beginPath();const rr=p*Rh*1.4;for(let i=0;i<6;i++){const a=i*Math.PI/3;i?c2.lineTo(ux+Math.cos(a)*rr,uy+Math.sin(a)*rr):c2.moveTo(ux+Math.cos(a)*rr,uy+Math.sin(a)*rr)}c2.closePath();c2.stroke()}}
  /* sparks: short vector strokes along velocity */
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=.016;if(p.l<=0){parts.splice(i,1);continue}p.x+=p.vx*.016;p.y+=p.vy*.016;const [x,y]=wp(p.x,p.y),k=Math.hypot(p.vx,p.vy)||1,L=p.len*Rh;line(c2,x,y,x-p.vx/k*L,y-p.vy/k*L,p.c,Math.max(0,p.l/p.m),1.2)}
  /* hull fragments and burst rings (octagon) */
  for(let i=frags.length-1;i>=0;i--){const f=frags[i];f.l-=.016;if(f.l<=0){frags.splice(i,1);continue}f.x+=f.vx*.016;f.y+=f.vy*.016;f.rot+=f.vr*.016;const [x,y]=wp(f.x,f.y);line(c2,x-Math.cos(f.rot)*f.len*Rh,y-Math.sin(f.rot)*f.len*Rh,x+Math.cos(f.rot)*f.len*Rh,y+Math.sin(f.rot)*f.len*Rh,f.col,Math.max(0,f.l/f.m),1.3)}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i],p=(now-r.t0)/700;if(p>1){rings.splice(i,1);continue}const [x,y]=wp(r.x,r.y),rr=(r.r*Rh*.6)*(1+p*5);c2.strokeStyle=`rgba(${RGB.gold},${(1-p)*.9})`;c2.lineWidth=1.4;c2.beginPath();for(let k=0;k<8;k++){const a=k*TAU/8+.4;k?c2.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):c2.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c2.closePath();c2.stroke()}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i],p=(now-f.t0)/1100;if(p>1){floats.splice(i,1);continue}const [x,y]=wp(f.x,f.y);c2.fillStyle=`rgba(${f.c},${1-p})`;c2.font='500 12px "IBM Plex Mono"';c2.textAlign='center';c2.fillText(f.t,x,y-p*30)}
  const cdp=cd.scan?Math.min(1,(now-cd.scan.t0)/cd.scan.dur):1;document.getElementById('ab-scan')&&setCd('scan',cdp,cd.scan);
  requestAnimationFrame(frame)}
function setCd(id,p,c){const b=document.getElementById('ab-'+id);if(!b||!c)return;const on=p<1;b.classList.toggle('cool',on);b.style.setProperty('--p',on?1-p:0);if(on)b.querySelector('.cdn').textContent=Math.ceil((1-p)*c.dur/1000)}
/* canvas picking */
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;hoverT=null;if(!scene)return;
  const near=(x,y,rad)=>Math.hypot(mx-x,my-y)<rad;
  if(scene.hostiles.some(h=>!h.dead&&near(...wp(h.x,h.y),CLS[h.cls].px*SC*2)))hoverT='h';
  else if(scene.salv&&near(...wp(scene.salv.x,scene.salv.y),Rh*.08))hoverT='s';
  else if(scene.derelict&&near(...wp(scene.derelict.x,scene.derelict.y),Rh*.3))hoverT='d';
  else if(scene.ast.some(a=>a.ore&&a.amt>0&&near(...wp(a.x,a.y),a.r*Rh*1.3)))hoverT='o';
  cv.style.cursor=hoverT?'pointer':'default'});
cv.addEventListener('click',()=>{if(hoverT){target=target===hoverT?null:hoverT;I.sfx('click');renderContacts()}else if(target){target=null;renderContacts()}});
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
  const di=D.findIndex(d=>d.key===k);if(di>=0){jump(di);return}
  const m={v:'scan',h:'harvest',f:'fire',c:'collect',b:'board',r:'recall',x:'stop'}[k];if(m){act(m);return}
  if(k==='tab'){e.preventDefault();selFleet((fi+1)%I.fleets.length);return}
  if(['1','2','3'].includes(k)){selFleet(+k-1);return}
  if(k==='escape'){target=null;document.getElementById('hsub').classList.remove('on');renderContacts()}});
document.getElementById('sheetbtn').onclick=()=>document.getElementById('right').classList.toggle('on');
resize();build();
log('Link established. Vanguard on station.','teal');log('Sector scan is 38 ticks old. Run a scan (V).','');
if(location.hash.includes('combat'))setTimeout(()=>{target='h';act('fire')},900);
requestAnimationFrame(frame);

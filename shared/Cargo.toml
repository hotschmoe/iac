[package]
name = "iac-shared"
version = "0.1.0"
edition = "2024"

[dependencies]
# Exact: another release may round a function differently, and that changes
# what every stored world plays next (see ECONOMY_VERSION).
libm = "=0.2.16"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: amounts are f64, and without it one f64 in ten is read back
# a bit away from what was written. A stored world and an order must be read
# as they were written, on every target, so every crate takes it from here.
serde_json = { version = "1", features = ["float_roundtrip"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
# Reads the wire types out of src/ for the Dart generator (tests/wire). A test
# dependency only: no build of the engine, native or wasm, compiles it.
syn = { version = "2", default-features = false, features = ["full", "parsing"] }

name: iac_client
description: "IN AMBER CLAD — Fleet Command Interface (Flutter web client for the Rust server)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.2
  path_drawing: ^1.0.1
  stream_channel: ^2.1.4
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Flutter's web engine fetches Roboto from fonts.gstatic.com as its default
  # family unless the app ships a family of that name. Nothing here is set in
  # it, so it is Plex Mono again and the page asks no other host for a font.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: IBMPlexSansCondensed
      fonts:
        - asset: assets/fonts/IBMPlexSansCondensed-Regular.ttf
        - asset: assets/fonts/IBMPlexSansCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansCondensed-Bold.ttf
          weight: 700

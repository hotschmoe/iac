[package]
name = "iac-client"
version = "0.1.0"
edition = "2024"

[dependencies]
iac-shared = { path = "../../shared" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
